<script type="text/x-dc" data-dc-script>
const Base = window.FSM_BASE;
const CHAVES_DAS_GAVETAS = [
  'abaAtividades',
  'abaAtividadesClasse',
  'abaAtividadesCor',
  'abaAtividadesFundo',
  'abaPresenca',
  'abaPresencaClasse',
  'abaPresencaCor',
  'abaPresencaFundo',
  'abrirDevolver',
  'atividade',
  'atividadeAberta',
  'cliente',
  'contestacao',
  'contestacaoTexto',
  'contestando',
  'declaracao',
  'detalheGrade',
  'detalheGradeAberto',
  'devolucaoTexto',
  'devolvendo',
  'devolvendoExpandido',
  'documento',
  'enviarContestacao',
  'erroContestacao',
  'erroDevolucao',
  'escreverContestacao',
  'escreverDevolucao',
  'fecharAtividade',
  'fecharContestacao',
  'fecharDetalheGrade',
  'fecharPresenca',
  'fecharRelatorio',
  'imprimir',
  'motivosContestacao',
  'presenca',
  'presencaAberta',
  'presencaCiclos',
  'relatorio',
  'relatorioAberto',
  'salvando',
  'temErroContestacao',
  'temErroDevolucao',
  'verAbaAtividades',
  'verAbaPresenca'
];
const {
  TIPOS,
  WDL: DIAS,
  dataDe,
  hojeIso,
  agoraMin,
  minDe,
  hmDe,
  hmTs,
  dmTs,
  dmIso,
  cicloIniIso,
  cicloFimIso,
  mesTxt,
  segDe,
  anoTxt,
  numero,
  msgErro,
  prazoDe
} = Base;
const REGISTRADAS = ['Realizada', 'Realizada parcialmente', 'Não realizada'];
const MENU = [
  ['inicio', 'Início'],
  ['agenda', 'Agendas dos oficineiros'],
  ['check', 'Check de atividades'],
  ['rel', 'Relatório mensal'],
  ['ponto', 'Presença na Escola']
];
const TITULOS = {
  inicio: 'Início',
  agenda: 'Agendas dos oficineiros',
  check: 'Check de atividades',
  rel: 'Relatório mensal de atividades',
  ponto: 'Presença na Escola'
};
const MOTIVOS_CONTESTACAO = [
  'A atividade não aconteceu',
  'Horário diferente do registrado',
  'Turma diferente',
  'Número de presentes divergente'
];
const ENGAJAMENTO = ['', 'Muito baixo', 'Baixo', 'Médio', 'Alto', 'Muito alto'];
const DECLARACAO_ATIVIDADES =
  'Declaro que as atividades acima foram realizadas conforme registrado, nas datas e turmas indicadas.';
const DECLARACAO_PRESENCA =
  'Declaro que os horários acima correspondem às minhas atividades presenciais na escola indicada. Todos os registros foram confirmados por geolocalização dentro do raio da escola, ou ajustados por justificativa aprovada pela direção da escola.';
const cicloDe = (iso, meses) => {
  const ciclo = Base.cicloComp(dataDe(iso));
  return Base.iso(new Date(ciclo.getFullYear(), ciclo.getMonth() + (meses || 0), 1));
};
const mesCurto = iso => Base.MESES[Number(String(iso).slice(5, 7)) - 1] + '/' + String(iso).slice(0, 4);
const turmaDaGrade = g => (g.tipo === 'F' || g.ano == null ? 'Professores' : anoTxt(g.ano) + ' · Turma ' + g.turma);
const primeiroNome = nome => String(nome || '').split(' ')[0];
const temposDeAula = (inicio, fim) => Math.max(1, Math.round((minDe(fim) - minDe(inicio)) / 50));
const minutosValidos = p => Base.minutosValidos(p);
const situacaoDoRegistro = a =>
  a.revisao_status === 'anulado'
    ? ['Anulada pela coordenação', 'var(--texto-cinza-600)', 'var(--fundo-cinza-70)']
    : a.situacao === 'Realizada'
      ? ['Registrada', 'var(--texto-verde-700)', 'var(--fundo-verde-80)']
      : a.situacao === 'Realizada parcialmente'
        ? ['Realizada parcialmente', 'var(--texto-verde-700)', 'var(--fundo-verde-80)']
        : a.situacao === 'Não realizada'
          ? [
              'Não realizada' + (a.motivo ? ' · ' + a.motivo : ''),
              'var(--texto-vermelho-600)',
              'var(--fundo-vermelho-50)'
            ]
          : [a.situacao || 'Pendente de registro', 'var(--texto-ambar-660)', 'var(--fundo-ambar-80)'];
const pendenteDeCheck = a =>
  REGISTRADAS.includes(a.situacao) &&
  a.revisao_status !== 'anulado' &&
  (!a.check_direcao || a.check_direcao === 'corrigida');
const ROTULOS_CHECK = {
  ok: ['Confirmada', 'var(--texto-verde-700)', 'var(--fundo-verde-80)'],
  ciente: ['Ciente', 'var(--texto-cinza-750)', 'var(--fundo-cinza-70)'],
  contestada: ['Contestada · aguardando oficineiro', 'var(--texto-vermelho-600)', 'var(--fundo-vermelho-50)'],
  corrigida: ['Corrigida pelo oficineiro · confirme de novo', 'var(--texto-azul-640)', 'var(--fundo-azul-40)']
};
const diasUteisAte = (de, ate) => {
  let dias = 0;
  for (let d = Base.add(dataDe(de), 1); Base.iso(d) <= ate; d = Base.add(d, 1)) if (Base.letivo(d)) dias++;
  return dias;
};
const SITUACOES_PRESENCA = {
  ok: ['No raio da escola', 'var(--texto-verde-700)', 'var(--fundo-verde-80)'],
  'Fora do raio': ['Fora do raio', 'var(--texto-ambar-660)', 'var(--fundo-ambar-80)'],
  'Sem encerramento': ['Sem encerramento', 'var(--texto-ambar-660)', 'var(--fundo-ambar-80)'],
  'Enviado sem internet': ['Enviado sem internet', 'var(--texto-azul-640)', 'var(--fundo-azul-40)'],
  'Sem localização': ['Sem localização', 'var(--texto-cinza-600)', 'var(--fundo-cinza-70)'],
  aberta: ['Na escola agora', 'var(--texto-azul-640)', 'var(--fundo-azul-40)'],
  falta: ['Sem presença', 'var(--texto-vermelho-600)', 'var(--fundo-vermelho-50)']
};
const EVENTOS_HISTORICO = {
  contestada: ['Contestada pela direção', 'var(--texto-vermelho-600)'],
  corrigida: ['Corrigida pelo oficineiro', 'var(--texto-azul-640)'],
  confirmada: ['Confirmada pela direção', 'var(--texto-verde-700)']
};
const atividadesPrevistas = (grade, semanas, oficineiroId, inicio, fim, hoje, agora) => {
  const previstas = [];
  if (!inicio || !fim || inicio > fim) return previstas;
  for (let d = dataDe(inicio); Base.iso(d) <= fim; d = Base.add(d, 1)) {
    const data = Base.iso(d);
    if (data > hoje) break;
    if (!Base.letivo(d)) continue;
    const diaSemana = d.getDay(),
      segunda = segDe(data);
    grade.forEach(aula => {
      if (oficineiroId && aula.oficineiro_id !== oficineiroId) return;
      if (aula.dia_semana !== diaSemana || Number(aula.ano_letivo) !== d.getFullYear()) return;
      if (aula.criado_em && String(aula.criado_em).slice(0, 10) > data) return;
      if (data === hoje && minDe(aula.fim) > agora) return;
      const daSemana = semanas.find(x => x.grade_aula_id === aula.id && x.semana === segunda);
      previstas.push({ aula, data, tipo: (daSemana && daSemana.tipo) || aula.tipo });
    });
  }
  return previstas;
};
const focar = id =>
  setTimeout(() => {
    const el = document.getElementById(id);
    if (el) el.focus();
  }, 30);
class Component extends DCLogic {
  state = {
    menuAberto: false,
    tela: 'inicio',
    aviso: '',
    logado: false,
    carregando: false,
    erro: '',
    notifAberto: false,
    acesso: null,
    escola: null,
    equipe: [],
    nomes: [],
    contratadas: [],
    presencas: [],
    atividades: [],
    grade: [],
    semanas: [],
    envios: [],
    historico: [],
    relatoriosCicloAnterior: [],
    relatorios: [],
    relatorioCiclo: '',
    relatoriosOcupado: false,
    relatorioDados: null,
    presencaLinhas: [],
    justificativas: [],
    presencaAtualizadaEm: null,
    detalheGrade: null,
    atividadeAberta: null,
    presencaOficineiro: null,
    presencaCiclo: 'mes',
    contestacao: null,
    contestacaoMotivo: MOTIVOS_CONTESTACAO[0],
    contestacaoTexto: '',
    contestacaoErro: '',
    relatorioAberto: null,
    relatorioAba: 'presenca',
    devolvendo: false,
    devolucaoTexto: '',
    devolucaoErro: '',
    salvando: false
  };
  memoria = { agenda: {}, check: {}, ponto: {} };
  componentDidMount() {
    this.aoTeclar = e => {
      if (e.key !== 'Escape') return;
      const s = this.state;
      if (s.notifAberto) return this.setState({ notifAberto: false });
      if (s.contestacao) return this.setState({ contestacao: null, contestacaoErro: '' });
      if (s.presencaOficineiro) return this.fecharPresenca();
      if (s.atividadeAberta) return this.fecharAtividade();
      if (s.detalheGrade) return this.setState({ detalheGrade: null });
      if (s.relatorioAberto) return this.setState({ relatorioAberto: null, devolvendo: false });
    };
    document.addEventListener('keydown', this.aoTeclar);
    this.relogio = setInterval(() => this.forceUpdate(), 60000);
    this.carregarDados();
  }
  componentWillUnmount() {
    document.removeEventListener('keydown', this.aoTeclar);
    clearInterval(this.relogio);
  }
  avisar(texto) {
    this.setState({ aviso: texto });
    clearTimeout(this.avisoTempo);
    this.avisoTempo = setTimeout(() => this.setState({ aviso: '' }), 2600);
  }
  daEscola(escolaId) {
    return registro => escolaId == null || registro.escola_id == null || registro.escola_id === escolaId;
  }
  async carregarDados() {
    const A = window.FSM_AUTH;
    if (!A || !A.logado || !A.logado()) return;
    if (!A.pessoasDaEscola || !A.relatoriosEscola) {
      this.setState({ logado: true, erro: 'Esta versão do site está desatualizada. Gere e publique o site de novo.' });
      return;
    }
    this.setState({ logado: true, carregando: true, erro: '' });
    try {
      const acesso = await A.meuAcesso();
      const hoje = hojeIso(),
        ano = Number(hoje.slice(0, 4)),
        inicio = cicloIniIso(cicloDe(hoje, -1));
      const [escolas, equipe, presencas, atividades, grade, semanas, envios, historico, nomes, contratadas] =
        await Promise.all([
          A.escolas(),
          A.pessoasDaEscola(),
          A.presencasRede(inicio, hoje),
          A.aulasRede(inicio, hoje),
          A.gradeRede(ano),
          A.semanasGrade(ano).catch(() => []),
          A.envioDaGrade(ano).catch(() => []),
          this.lerHistorico(inicio),
          A.nomesDaEscola ? A.nomesDaEscola().catch(() => []) : [],
          A.contratadasEscola ? A.contratadasEscola().catch(() => []) : []
        ]);
      const escola = (escolas || []).find(e => e.id === (acesso && acesso.escola_id)) || null;
      const minha = acesso ? this.daEscola(acesso.escola_id) : () => true;
      this.setState(
        {
          acesso: acesso || {},
          escola,
          equipe: (equipe || []).filter(minha),
          presencas: (presencas || []).filter(minha),
          atividades: (atividades || []).filter(minha),
          grade: (grade || []).filter(minha),
          semanas: semanas || [],
          envios: envios || [],
          historico,
          nomes: nomes || [],
          contratadas: contratadas || [],
          carregando: false,
          relatorioCiclo: this.state.relatorioCiclo || cicloDe(hoje, -1)
        },
        () => {
          this.carregarRelatorios(this.state.relatorioCiclo, true);
          this.carregarPresenca();
        }
      );
    } catch (x) {
      this.setState({ carregando: false, erro: msgErro(x, 'Não foi possível carregar os dados da escola.') });
    }
  }
  lerHistorico(desde) {
    const A = window.FSM_AUTH;
    return A && A.historicoCheck ? A.historicoCheck(desde).catch(() => null) : Promise.resolve(null);
  }
  async recarregarAtividades() {
    const A = window.FSM_AUTH,
      hoje = hojeIso(),
      inicio = cicloIniIso(cicloDe(hoje, -1)),
      minha = this.daEscola((this.state.acesso || {}).escola_id);
    try {
      const [presencas, atividades, historico] = await Promise.all([
        A.presencasRede(inicio, hoje),
        A.aulasRede(inicio, hoje),
        this.lerHistorico(inicio)
      ]);
      this.setState({
        presencas: (presencas || []).filter(minha),
        atividades: (atividades || []).filter(minha),
        historico
      });
    } catch (x) {
      this.setState({ erro: msgErro(x, 'Não foi possível atualizar as atividades.') });
    }
  }
  async carregarRelatorios(ciclo, tambemAnterior) {
    const A = window.FSM_AUTH,
      hoje = hojeIso(),
      anterior = cicloDe(hoje, -1),
      pedido = ciclo || this.state.relatorioCiclo || anterior;
    this.setState({ relatoriosOcupado: true });
    try {
      const minha = this.daEscola((this.state.acesso || {}).escola_id);
      let dados = null;
      if (pedido < anterior) {
        const fim = Base.iso(Base.cicloFim(dataDe(pedido), 'mensal')),
          inicio = Base.iso(Base.cicloIni(dataDe(pedido), 'dia21')),
          ano = Number(pedido.slice(0, 4)),
          mesmoAno = ano === Number(hoje.slice(0, 4));
        const [presencas, atividades, grade, semanas] = await Promise.all([
          A.presencasRede(inicio, fim),
          A.aulasRede(inicio, fim),
          mesmoAno ? Promise.resolve(null) : A.gradeRede(ano),
          mesmoAno ? Promise.resolve(null) : A.semanasGrade(ano).catch(() => [])
        ]);
        dados = {
          ciclo: pedido,
          presencas: (presencas || []).filter(minha),
          atividades: (atividades || []).filter(minha),
          grade: grade ? grade.filter(minha) : null,
          semanas
        };
      }
      const [lista, listaAnterior] = await Promise.all([
        A.relatoriosEscola(pedido),
        tambemAnterior && pedido !== anterior ? A.relatoriosEscola(anterior) : Promise.resolve(null)
      ]);
      if ((this.state.relatorioCiclo || anterior) !== pedido) return;
      this.setState({
        relatorios: lista || [],
        relatorioDados: dados,
        relatoriosOcupado: false,
        ...(pedido === anterior
          ? { relatoriosCicloAnterior: lista || [] }
          : listaAnterior
            ? { relatoriosCicloAnterior: listaAnterior }
            : {})
      });
    } catch (x) {
      const semFuncao = /relatorios_escola|function|PGRST202/i.test(String((x && x.message) || ''));
      this.setState({
        relatoriosOcupado: false,
        erro: semFuncao
          ? 'Os relatórios mensais ainda não estão disponíveis no banco. Rode o arquivo 40_direcao_escolar.sql no Supabase.'
          : msgErro(x, 'Não foi possível carregar os relatórios.')
      });
    }
  }
  async carregarPresenca() {
    const A = window.FSM_AUTH;

  presencaDoOficineiro(contexto) {
    const s = this.state,
      hoje = contexto.hoje;
    const oficineiro = s.presencaOficineiro
      ? contexto.oficineiros.find(o => o.id === s.presencaOficineiro) ||
        s.equipe.find(p => p.id === s.presencaOficineiro)
      : null;
    if (!oficineiro) return null;
    const anterior = s.presencaCiclo === 'ant',
      inicio = anterior ? contexto.inicioCicloAnterior : contexto.inicioCicloAtual,
      fim = anterior ? cicloFimIso(contexto.cicloAnterior) : hoje;
    const presencas = s.presencas.filter(p => p.oficineiro_id === oficineiro.id && p.data >= inicio && p.data <= fim);
    const previstas = new Set(
      atividadesPrevistas(contexto.grade, s.semanas, oficineiro.id, inicio, fim, hoje, 24 * 60).map(x => x.data)
    );
    const dias = [...new Set([...presencas.map(p => p.data), ...previstas])].sort().reverse();
    let foraDoRaio = 0,
      faltas = 0;
    const linhas = dias.map(data => {
      const p = presencas.find(x => x.data === data),
        ehHoje = data === hoje;
      let situacao;
      if (!p) {
        situacao = ehHoje
          ? ['Ainda não chegou', 'var(--texto-cinza-600)', 'var(--fundo-cinza-70)']
          : SITUACOES_PRESENCA.falta;
        if (!ehHoje) faltas++;
      } else if (!p.fim) situacao = ehHoje ? SITUACOES_PRESENCA.aberta : SITUACOES_PRESENCA['Sem encerramento'];
      else situacao = SITUACOES_PRESENCA[p.conferencia] || SITUACOES_PRESENCA.ok;
      if (p && p.conferencia === 'Fora do raio') foraDoRaio++;
      return {
        dia: DIAS[dataDe(data).getDay()].slice(0, 3) + ', ' + dmIso(data),
        horario: p
          ? (p.fim
              ? hmTs(p.inicio) + '–' + hmTs(p.fim)
              : ehHoje
                ? 'Desde ' + hmTs(p.inicio)
                : hmTs(p.inicio) + ' · sem saída') +
            (!p.pausa_inicio
              ? ''
              : p.pausa_fim
                ? ' · pausa ' + hmTs(p.pausa_inicio) + '–' + hmTs(p.pausa_fim)
                : ' · pausa desde ' + hmTs(p.pausa_inicio))
          : '—',
        horas: p && p.fim ? Base.dur(minutosValidos(p)) : '',
        situacao: situacao[0],
        situacaoCor: situacao[1],
        situacaoFundo: situacao[2]
      };
    });
    const encerradas = presencas.filter(p => p.fim);
    const diasComPresenca = new Set(encerradas.map(p => p.data)).size;
    return {
      nome: oficineiro.nome,
      linhas,
      vazio: !linhas.length,
      resumo:
        diasComPresenca +
        (diasComPresenca === 1 ? ' dia' : ' dias') +
        ' · ' +
        Base.dur(encerradas.reduce((total, p) => total + minutosValidos(p), 0)) +
        ' válidas' +
        (faltas ? ' · ' + faltas + (faltas === 1 ? ' dia sem presença' : ' dias sem presença') : '') +
        (foraDoRaio ? ' · ' + foraDoRaio + ' fora do raio' : '')
    };
  }

    const tipoCiclo = Base.cicloDe(oficineiro.documento_tipo),
      inicioData = Base.cicloIni(dataDe(ciclo), tipoCiclo),
      fimData = Base.cicloFim(dataDe(ciclo), tipoCiclo),
      inicio = Base.iso(inicioData),
      fim = Base.iso(fimData);
    const previstas = atividadesPrevistas(dados.grade, dados.semanas || [], oficineiroId, inicio, fim, hoje, agora);
    const registros = dados.atividades.filter(
      a => a.oficineiro_id === oficineiroId && a.data >= inicio && a.data <= fim && a.revisao_status !== 'anulado'
    );
    const semCheck = relatorio.registradas - relatorio.confirmadas;
    const presenca = Base.docPresenca({
      ini: inicioData,
      ate: fim < hoje ? fimData : dataDe(hoje),
      hojeIso: hoje,
      pres: dados.presencas.filter(p => p.oficineiro_id === oficineiroId && p.data >= inicio && p.data <= fim),
      ajustes: (s.justificativas || []).filter(j => j.oficineiro_id === oficineiroId),
      comGrade: data => previstas.some(x => x.data === data)
    });
    const usados = new Set();
    const itens = previstas.map(x => {
      const registro = registros.find(a => a.grade_aula_id === x.aula.id && a.data === x.data);
      if (registro) usados.add(registro.id);
      return { dia: dataDe(x.data), aula: x.aula, registro };
    });
    registros
      .filter(a => !usados.has(a.id))
      .forEach(registro => itens.push({ dia: dataDe(registro.data), aula: null, registro }));
    itens.sort(
      (x, y) =>
        Base.iso(x.dia).localeCompare(Base.iso(y.dia)) ||
        String((x.registro || x.aula).inicio).localeCompare(String((y.registro || y.aula).inicio))
    );
    const atividades = Base.docAtividades(
      itens.map(({ dia, aula, registro }) => ({
        d: dia,
        inicio: (registro || aula).inicio,
        fim: (registro || aula).fim,
        turma: registro ? registro.turma : turmaDaGrade(aula),
        atividade: (registro && registro.atividade) || (TIPOS[(registro || aula).tipo] || [''])[0],
        sit: !registro ? 'Agendada' : registro.situacao === 'Não realizada' ? 'Não realizada' : 'Realizada',
        presentes: registro ? registro.presentes : null,
        registro: registro
          ? registro.situacao === 'Não realizada'
            ? registro.motivo
            : registro.conteudo || registro.objetivo
          : ''
      }))
    );
    const frequencia = {};
    [...registros, ...previstas.map(x => x.aula)].forEach(x => {
      if (x && x.oficina) frequencia[x.oficina] = (frequencia[x.oficina] || 0) + 1;
    });
    const momento = new Date();
    const contratada = (s.contratadas || []).find(c => c.id === oficineiroId) || {};
    const referencia = String(relatorio.id).padStart(5, '0');
    const comum = {
      nome: String(relatorio.oficineiro || '—').toUpperCase(),
      identificacaoRotulo: contratada.tipo === 'CPF' ? 'CPF' : 'CNPJ',
      identificacao: contratada.mascara || 'Não informado',
      escola: String((s.escola || {}).nome || '—').toUpperCase(),
      oficina: Object.keys(frequencia).sort((a, b) => frequencia[b] - frequencia[a])[0] || '—',
      assinaturas: [
        Base.docAssinatura(
          'Oficineiro(a)',
          relatorio.oficineiro,
          relatorio.status !== 'devolvido' ? relatorio.fechado_em : null
        ),
        Base.docAssinatura(
          'Direção da escola',
          relatorio.direcao_nome ? relatorio.direcao_nome + ' · Diretor(a)' : '',
          relatorio.direcao_em
        ),
        Base.docAssinatura(
          'Coordenação',
          relatorio.coordenacao_nome ? relatorio.coordenacao_nome + ' · Coordenador(a)' : '',
          relatorio.coordenacao_em
        )
      ],
      gerado:
        'Gerado pelo Oficineiro+ (oficineiromais.com.br) em ' +
        Base.dmy(momento) +
        ' às ' +
        Base.hm(momento.getHours() * 60 + momento.getMinutes())
    };
    const cicloTexto = 'CICLO ' + Base.dmy(inicioData) + ' A ' + Base.dmy(fimData);
    return {
      rotulo: 'Documentos do ciclo de ' + relatorio.oficineiro,
      nome: relatorio.oficineiro,
      ciclo: mesCurto(ciclo),
      podeDecidir: relatorio.status === 'fechado',
      temAviso:
        relatorio.status === 'fechado' ? semCheck > 0 || relatorio.contestadas > 0 : relatorio.status === 'devolvido',
      aviso:
        relatorio.status === 'devolvido'
          ? 'Devolvido ao oficineiro' +
            (relatorio.motivo_devolucao ? ': ' + relatorio.motivo_devolucao : '.') +
            ' Aguardando o reenvio.'
          : (semCheck > 0
              ? semCheck +
                (semCheck === 1
                  ? ' atividade registrada ainda não teve'
                  : ' atividades registradas ainda não tiveram') +
                ' o check da direção'
              : '') +
            (relatorio.contestadas > 0
              ? (semCheck > 0 ? ' · ' : '') +
                relatorio.contestadas +
                (relatorio.contestadas === 1 ? ' atividade contestada aguarda' : ' atividades contestadas aguardam') +
                ' o oficineiro'
              : '') +
            '. Você pode aprovar assim mesmo ou devolver ao oficineiro.',
      documentoPresenca: {
        ...comum,
        titulo: 'RELATÓRIO DE PRESENÇA NA ESCOLA · ' + cicloTexto,
        linhas: presenca.linhas,
        total: presenca.total,
        resumo: presenca.resumo,
        codigo: 'Documento PRE-' + ciclo.slice(0, 7) + '-' + referencia
      },
      documentoAtividades: {
        ...comum,
        titulo: 'RELATÓRIO DE ATIVIDADES · ' + cicloTexto,
        atividades: atividades.linhas,
        semAtividades: !atividades.linhas.length,
        resumo: atividades.resumo,
        codigo: 'Documento ATV-' + ciclo.slice(0, 7) + '-' + referencia
      },
      aprovar: () => this.aprovarRelatorio(relatorio),
      devolver: () => this.devolverRelatorio(relatorio)
    };
  }
  avisosDaEscola(contexto) {
    const s = this.state,
      { cicloAnterior, aguardandoCheck, filtrosDoCheck } = contexto,
      { pendentes, prazoTexto, prazoVencido } = contexto.relatorios;
    const lista = [];
    if (pendentes.length)
      lista.push({
        tit:
          pendentes.length === 1
            ? '1 relatório mensal aguardando sua aprovação'
            : pendentes.length + ' relatórios mensais aguardando sua aprovação',
        txt: pendentes.map(r => r.oficineiro).join(', ') + ' · ' + mesTxt(cicloAnterior) + '. ' + prazoTexto + '.',
        ref: cicloAnterior + ':' + pendentes.map(r => r.id).join(','),
        acao: 'Abrir relatórios',
        go: () => this.irPara('rel', null, { relatorioCiclo: cicloAnterior }),
        cor: prazoVencido ? 'var(--texto-vermelho-600)' : 'var(--texto-ciano-660)'
      });
    const grades = contexto.gradesPendentes;
    if (grades.length)
      lista.push({
        tit:
          grades.length === 1
            ? '1 grade de oficineiro para validar'
            : grades.length + ' grades de oficineiros para validar',
        txt: 'Grades enviadas pelos oficineiros da escola aguardando a validação da direção.',
        ref: grades.map(e => e.oficineiro_id + ':' + e.enviado_em).join(','),
        acao: 'Abrir agenda',
        go: () => this.irPara('agenda', grades.length === 1 ? { oficineiro: grades[0].oficineiro_id } : null),
        cor: 'var(--texto-azul-640)'
      });
    const novas = aguardandoCheck.filter(a => !a.check_direcao);
    if (novas.length)
      lista.push({
        tit: novas.length === 1 ? '1 atividade para confirmar' : novas.length + ' atividades para confirmar',
        txt: 'Atividades registradas pelos oficineiros aguardando a confirmação da escola.',
        ref: String(novas.length) + ':' + Math.max(...novas.map(a => a.id)),
        acao: 'Abrir check de atividades',
        go: () => this.irPara('check', filtrosDoCheck(novas)),
        cor: 'var(--texto-ambar-660)'
      });
    const corrigidas = s.atividades.filter(a => a.check_direcao === 'corrigida');
    if (corrigidas.length)
      lista.push({
        tit:
          corrigidas.length === 1
            ? '1 atividade corrigida após sua contestação'
            : corrigidas.length + ' atividades corrigidas após sua contestação',
        txt: 'O oficineiro ajustou o registro. Confira e confirme de novo.',
        ref: corrigidas.map(a => a.id).join(','),
        acao: 'Ver atividades corrigidas',
        go: () => this.irPara('check', filtrosDoCheck(corrigidas)),
        cor: 'var(--texto-azul-640)'
      });
    const emAnalise = contexto.justificativasEmAnalise;
    const sinalizadas = emAnalise.filter(j => j.sinal_qtd > 0);
    if (sinalizadas.length)
      lista.push({
        tit:
          sinalizadas.length === 1
            ? '1 justificativa sinalizada pela coordenação'
            : sinalizadas.length + ' justificativas sinalizadas pela coordenação',
        txt: [...new Set(sinalizadas.map(j => j.nome))].join(', ') + '.',
        ref: sinalizadas.map(j => j.id + ':' + j.sinal_qtd).join(','),
        acao: 'Abrir Presença na Escola',
        go: () => this.irPara('ponto'),
        cor: 'var(--texto-ambar-745)'
      });
    if (emAnalise.length)
      lista.push({
        tit:
          emAnalise.length === 1
            ? '1 justificativa de presença para decidir'
            : emAnalise.length + ' justificativas de presença para decidir',
        txt: [...new Set(emAnalise.map(j => j.nome))].join(', ') + '.',
        ref: emAnalise.map(j => j.id).join(','),
        acao: 'Abrir Presença na Escola',
        go: () => this.irPara('ponto'),
        cor: 'var(--texto-indigo-360)'
      });
    return lista.map(aviso => ({ ...aviso, temAcao: !!(aviso.acao && aviso.go) }));
  }
  notificacoes(avisos) {
    return window.FSM_NOTIF.sino(this, 'direcao', avisos, () => {
      this.setState({ notifAberto: true, menuAberto: false });
    });
  }
  renderVals() {
    const valores = this.valoresDaTela();
    return {
      ...valores,
      gavetaDeNotificacoes: window.FSM_NOTIF.chavesDaGaveta(valores),
      gavetasDoPerfil: Base.escolher(valores, CHAVES_DAS_GAVETAS)
    };
  }
  valoresDaTela() {
    const s = this.state;
    const contexto = this.contextoDaEscola();
    const { oficineiros, aguardandoCheck } = contexto;
    const escola = s.escola || {};
    const selos = {
      agenda: contexto.gradesPendentes.length,
      check: aguardandoCheck.length,
      rel: contexto.relatorios.pendentes.length,
      ponto: contexto.justificativasEmAnalise.length
    };
    const menu = MENU.map(([tela, rotulo]) => {
      const ativa = s.tela === tela,
        selo = selos[tela] ? String(selos[tela]) : '';
      return {
        label: rotulo,
        tag: selo,
        tagBg: selo ? 'var(--destaque-ambar-310)' : 'transparent',
        atual: ativa ? 'page' : 'false',
        go: () => {
          if (tela === 'check') Object.assign(this.memoria.check, contexto.filtrosDoCheck(aguardandoCheck));
          this.setState({ tela, menuAberto: false }, () => {
            if (!s.logado) return;
            if (tela === 'rel') this.carregarRelatorios(this.state.relatorioCiclo, true);
            if (tela === 'check') this.recarregarAtividades();
            if (tela === 'ponto') this.carregarPresenca();
          });
        },
        classe: ativa ? 'fundo-branco-a9' : 'fundo-transparent',
        bg: ativa ? 'rgba(255,255,255,.09)' : 'transparent',
        fg: ativa ? 'var(--destaque-branco)' : 'var(--destaque-cinza-180)',
        dot: ativa ? 'var(--destaque-ciano-400)' : 'transparent'
      };
    });
    const trilhas = {
      inicio:
        (escola.sigla || 'Escola') +
        ' · ' +
        oficineiros.length +
        (oficineiros.length === 1 ? ' oficineiro' : ' oficineiros'),
      agenda: 'Grade semanal dos oficineiros da escola',
      check: 'Confirmação das atividades registradas',
      rel: 'Aprovação da direção → coordenação do núcleo',
      ponto: 'Presença dos oficineiros e justificativas da escola'
    };
    const registroAberto = s.atividadeAberta ? s.atividades.find(a => a.id === s.atividadeAberta) : null;
    const presenca = this.presencaDoOficineiro(contexto);
    const relatorioSelecionado = s.relatorioAberto
      ? contexto.relatorios.lista.find(r => r.id === s.relatorioAberto)
      : null;
    const relatorio = this.relatorioDetalhado(contexto, relatorioSelecionado);
    const abaAtividades = s.relatorioAba === 'atividades';
    const estiloAba = ativa =>
      ativa
        ? ['', 'var(--destaque-branco)', 'var(--destaque-ciano-880)']
        : ['fundo-transparent', 'transparent', 'var(--destaque-branco)'];
    const [abaPresencaClasse, abaPresencaFundo, abaPresencaCor] = estiloAba(!abaAtividades);
    const [abaAtividadesClasse, abaAtividadesFundo, abaAtividadesCor] = estiloAba(abaAtividades);
    return {
      cliente: Base.cliente(),
      ...this.notificacoes(this.avisosDaEscola(contexto)),
      contexto,
      memoriaAgenda: this.memoria.agenda,
      memoriaCheck: this.memoria.check,
      memoriaPonto: this.memoria.ponto,
      is: {
        inicio: s.logado && s.tela === 'inicio',
        agenda: s.logado && s.tela === 'agenda',
        checkAtividades: s.logado && s.tela === 'check',
        relatorio: s.logado && s.tela === 'rel',
        ponto: s.logado && s.tela === 'ponto'
      },
      semLogin: !s.logado,
      escolaNome: escola.sigla
        ? escola.sigla + ' - ' + String(escola.nome || '').replace(new RegExp('^' + escola.sigla + '\\s*-\\s*'), '')
        : 'Escola',
      menu,
      menuClasse: s.menuAberto ? 'open' : '',
      abrirMenu: () => this.setState({ menuAberto: true }),
      fecharMenu: () => this.setState({ menuAberto: false }),
      titulo: TITULOS[s.tela],
      trilha: trilhas[s.tela],
      notifAberto: !!s.notifAberto,
      fecharNotif: () => this.setState({ notifAberto: false }),
      temConfig: typeof window.fsmConfiguracoes === 'function',
      abrirConfig: () => {
        if (this.state.menuAberto) this.setState({ menuAberto: false });
        if (typeof window.fsmConfiguracoes === 'function') window.fsmConfiguracoes();
      },
      temSair: typeof window.fsmSair === 'function',
      sairConta: () => {
        if (typeof window.fsmSair === 'function') window.fsmSair();
      },
      temErro: !!s.erro,
      erro: s.erro,
      tentarDeNovo: () => this.setState({ erro: '' }, () => this.carregarDados()),
      salvando: !!s.salvando,
      detalheGradeAberto: !!s.detalheGrade,
      detalheGrade: s.detalheGrade || {},
      fecharDetalheGrade: () => this.setState({ detalheGrade: null }),
      atividadeAberta: !!registroAberto,
      atividade: this.atividadeDetalhada(contexto, registroAberto),
      fecharAtividade: () => this.fecharAtividade(),
      presencaAberta: !!presenca,
      presenca: presenca || {},
      presencaCiclos: [
        ['mes', 'Ciclo ' + Base.cicloTxt(dataDe(contexto.cicloAtual))],
        ['ant', 'Ciclo ' + Base.cicloTxt(dataDe(contexto.cicloAnterior))]
      ].map(([ciclo, rotulo]) => {
        const ativo = s.presencaCiclo === ciclo;
        return {
          rotulo,
          ativo: ativo ? 'true' : 'false',
          escolher: () => this.setState({ presencaCiclo: ciclo }),
          classe: ativo ? 'fundo-branco' : 'fundo-transparent',
          fundo: ativo ? 'var(--fundo-branco)' : 'transparent',
          cor: ativo ? 'var(--texto-ciano-850)' : 'var(--texto-cinza-600)'
        };
      }),
      fecharPresenca: () => this.fecharPresenca(),
      contestando: !!s.contestacao,
      contestacao: s.contestacao || {},
      fecharContestacao: () => this.setState({ contestacao: null, contestacaoErro: '' }),
      motivosContestacao: MOTIVOS_CONTESTACAO.map(motivo => {
        const ativo = s.contestacaoMotivo === motivo;
        return {
          rotulo: motivo,
          ativo: ativo ? 'true' : 'false',
          ...Base.estiloOpcao(ativo),
          escolher: () => this.setState({ contestacaoMotivo: motivo })
        };
      }),
      contestacaoTexto: s.contestacaoTexto,
      escreverContestacao: e => this.setState({ contestacaoTexto: e.target.value, contestacaoErro: '' }),
      temErroContestacao: !!s.contestacaoErro,
      erroContestacao: s.contestacaoErro,
      enviarContestacao: () => this.enviarContestacao(),
      relatorioAberto: !!relatorioSelecionado,
      relatorio,
      documento: (abaAtividades ? relatorio.documentoAtividades : relatorio.documentoPresenca) || {},
      abaPresenca: !abaAtividades,
      abaAtividades,
      abaPresencaClasse,
      abaPresencaFundo,
      abaPresencaCor,
      abaAtividadesClasse,
      abaAtividadesFundo,
      abaAtividadesCor,
      verAbaPresenca: () => this.setState({ relatorioAba: 'presenca' }),
      verAbaAtividades: () => this.setState({ relatorioAba: 'atividades' }),
      declaracao: abaAtividades ? DECLARACAO_ATIVIDADES : DECLARACAO_PRESENCA,
      fecharRelatorio: () => this.setState({ relatorioAberto: null, devolvendo: false }),
      imprimir: () => window.print(),
      devolvendo: s.devolvendo,
      devolvendoExpandido: s.devolvendo ? 'true' : 'false',
      abrirDevolver: () =>
        this.setState({ devolvendo: !s.devolvendo, devolucaoErro: '' }, () =>
          setTimeout(() => {
            const el = document.getElementById('dir-dev-txt');
            if (el && this.state.devolvendo) el.focus();
          }, 30)
        ),
      devolucaoTexto: s.devolucaoTexto,
      escreverDevolucao: e => this.setState({ devolucaoTexto: e.target.value, devolucaoErro: '' }),
      temErroDevolucao: !!s.devolucaoErro,
      erroDevolucao: s.devolucaoErro,
      aviso: s.aviso
    };
  }
}
</script>
</body>
</html>
