  valoresDeApoio(s) {
    const nomeDoOficineiro = id => {
      const o = s.oficineiros.find(x => x.id === id);
      return o ? o.nome : '—';
    };
    const escolaDe = id => {
      const e = s.escolas.find(x => x.id === id);
      return e ? e.nome : '—';
    };
    const minutosDaPresenca = p => (p.fim ? Math.round((new Date(p.fim) - new Date(p.inicio)) / 60000) : null);
    const pausaDaPresenca = p => {
      if (!p.pausa_inicio || !p.fim) return 0;
      const a = Math.max(new Date(p.inicio).getTime(), new Date(p.pausa_inicio).getTime()),
        b = Math.min(new Date(p.fim).getTime(), new Date(p.pausa_fim || p.fim).getTime());

    const minutosTrabalhados = p => {
      if (!p.fim) return null;
      if (p.trabalhado_min != null) return p.trabalhado_min;
      const b = Math.max(0, minutosDaPresenca(p));
      if (p.pausa_inicio) return Math.max(0, b - pausaDaPresenca(p));

          : [
              !p.fim ? 'Pendente · saída não registrada' : 'Pendente · volta do almoço não registrada',
              'var(--texto-cinza-750)',
              'var(--fundo-cinza-90)'

      const t = minutosTrabalhados(p);
      return t > Base.MINUTOS_DO_DIA
        ? [
            'Acima de 8h · ' + (t - Base.MINUTOS_DO_DIA) + ' min não contabilizados',
            'var(--texto-ambar-745)',
            'var(--fundo-ambar-80)'

        : ['Regular', 'var(--texto-verde-760)', 'var(--fundo-verde-80)'];
    };
    const anoAtual = new Date().getFullYear();
    const gradesAguardandoNoAno = a => s.enviosDaGrade.filter(e => e.status === 'enviada' && e.ano_letivo === a).length;
    const atividadeNaSemana = (g, seg) => {
      const o = (s.semanasDaGrade || []).find(x => x.grade_aula_id === g.id && x.semana === seg);
      return o
        ? {

            solucao: o.solucao,
            componente: o.tipo === 'R' ? o.componente || g.componente : null,
            oficina: o.tipo === 'P' ? o.oficina : null,
            personalizada: true
          }
        : g;
    };
    const gradesAguardando = gradesAguardandoNoAno(anoAtual) + gradesAguardandoNoAno(anoAtual + 1);
    const abaDasAtividades = s.abas.aulas || 'ofic';
    const agora = new Date(),
      hojeDasAtividades = Base.iso(agora),
      minutosDeAgora = agora.getHours() * 60 + agora.getMinutes();
    const periodo = this.intervaloDoPeriodo(s.periodoDasAtividades),

    const gradeCompleta = [...s.grade, ...s.gradeAnterior],

    gradeCompleta.forEach(g => {
      gradePorId[g.id] = g;

    const siglaDaEscola = id => {

    const noFiltroDasAtividades = x =>

      minutosContabilizados,
      minutosDaPresenca,
      minutosDeAgora,
      minutosValidos,
      noFiltroDasAtividades,
      nomeDoOficineiro,
      ocorrenciasPendentes,
      pausaDaPresenca,
      periodo,
      presencaFechada,
      registroPorChave,
      semLembrete,
      siglaDaEscola,
      situacaoDaPresenca

              this.setState({ baseAcessos: { ...this.state.baseAcessos, carregado: false } });
          }),
        classe: ativo ? 'fundo-branco-a9' : 'fundo-transparent',
        bg: ativo ? 'rgba(255,255,255,.09)' : 'transparent',
        fg: ativo ? 'var(--destaque-branco)' : 'var(--destaque-cinza-180)',
        dot: ativo ? 'var(--destaque-ciano-400)' : 'transparent',
        atual: ativo ? 'page' : 'false'
      };
    });
    const titulos = {
      presenca: 'Presença na Escola',
      agendas: 'Agendas dos oficineiros',
      aulas: 'Atividades dos oficineiros',
      rel: 'Relatórios',
      prod: 'Produtividade',
      jornada: 'Jornada do Usuário',
      contas: 'Gestão de Contas',
      adm: 'Visão geral do sistema',
      consulta: 'Consulta e correções',
      escolas: 'Escolas e turmas',
      carteiras: 'Carteiras',
      feriados: 'Feriados e recessos',
      convites: 'Convites de primeiro acesso',
      baseAcessos: 'Base de acessos do B.I.',
      sistema: 'Configurações do sistema',
      auditoria: 'Auditoria'
    };
    const abaAtual = s.abas[s.tela];
    const notificacoes = (() => {
      const lista = [],
        ir = (tela, aba) => () =>
          this.setState({
            notificacoesAbertas: false,
            menuAberto: false,
            tela,
            ...(aba ? { abas: { ...s.abas, [tela]: aba } } : {})
          });
      const n = (k, um, varios) => (k === 1 ? um : k + ' ' + varios);
      if (s.conectado) {
        const relatoriosAprovados = (s.relatoriosDoCicloBase || []).filter(r => r.status === 'aprovado_direcao');
        if (relatoriosAprovados.length)
          lista.push({
            tit: n(
              relatoriosAprovados.length,
              '1 relatório mensal aguardando sua aprovação',
              'relatórios mensais aguardando sua aprovação'
            ),
            txt: 'Aprovados pela direção da escola: ' + relatoriosAprovados.map(r => r.oficineiro).join(', ') + '.',
            ref: relatoriosAprovados.map(r => r.id).join(','),
            acao: 'Abrir relatórios',
            go: () =>
              this.setState(
                {
                  notificacoesAbertas: false,
                  menuAberto: false,
                  tela: 'rel',
                  cicloDosRelatorios: this.cicloBaseDosRelatorios()
                },
                () => this.carregarRelatoriosDoCiclo(this.cicloBaseDosRelatorios())
              ),
            cor: 'var(--texto-ciano-660)'
          });
        const agoraC = new Date();
        const semRegistro = (s.painel || []).filter(r => r.escalado && r.situacao === 'sem_registro');
        if (Base.letivo(agoraC) && agoraC.getHours() * 60 + agoraC.getMinutes() >= 9 * 60 && semRegistro.length)
          lista.push({
            tit: n(semRegistro.length, '1 oficineiro sem registro hoje', 'oficineiros sem registro hoje'),
            txt:
              'Ainda não registraram a entrada: ' +
              semRegistro
                .slice(0, 5)
                .map(o => o.nome)
                .join(', ') +
              (semRegistro.length > 5 ? ' e outros.' : '.'),
            acao: 'Ver presença de hoje',
            go: ir('presenca', 'agora'),
            cor: 'var(--texto-cinza-600)'
          });
        const semLembN = ocorrenciasPendentes.filter(semLembrete).length;
        if (s.atividadesCarregadas && s.periodoDasAtividades === 'm0' && semLembN)
          lista.push({
            tit: n(semLembN, '1 atividade sem registro e sem lembrete', 'atividades sem registro e sem lembrete'),
            txt: 'Atividades da grade que ainda não foram registradas e para as quais nenhum lembrete foi enviado.',
            acao: 'Ver atividades pendentes',
            go: ir('aulas', 'pend'),
            cor: 'var(--texto-ambar-660)'
          });
      }
      return lista.map(x => ({ ...x, temAcao: !!(x.acao && x.go) }));
    })();
    const justificativasPendentes = (s.ajustes || []).filter(a => a.status === 'em_analise').length;
    const tabs = (ABAS_POR_TELA[s.tela] || []).map(([k, l]) => ({
      rotulo:
        s.tela === 'agendas' && k === 'cons' && gradesAguardando
          ? l + ' · ' + gradesAguardando + ' em validação'
          : s.tela === 'presenca' && k === 'just' && justificativasPendentes
            ? l + ' · ' + justificativasPendentes + ' em análise'
            : l,
      escolher: () =>
        this.setState({ abas: { ...s.abas, [s.tela]: k } }, () => k === 'just' && this.carregarJustificativas()),
      classe: abaAtual === k ? 'fundo-branco' : 'fundo-transparent',
      fundo: abaAtual === k ? 'var(--fundo-branco)' : 'transparent',
      cor: abaAtual === k ? 'var(--texto-ciano-850)' : 'var(--texto-cinza-600)'
    }));
    const naAba = (tela, k) => s.tela === tela && abaAtual === k;
    return { menu, naAba, notificacoes, tabs, titulos };
  }
  valoresDasContas(s) {
    return window.FSM_GESTAO_CONTAS.valoresDasContas.call(this, s);
  }
  valoresDoSistema(s, valores) {
    return window.FSM_ADMINISTRACAO.valoresDoSistema.call(this, s, valores);
  }
  valoresDoLote(s) {
    return { lote: Contas.detalharLote(s.lote, PERFIS_DO_LOTE), loteAtual: s.lote };
  }
  telasVisiveis(s, valores) {
    const { naAba } = valores;
    const is = {
      produtividade: s.tela === 'prod',
      jornada: !s.ehAdmin && s.tela === 'jornada',
      presencaAgora: naAba('presenca', 'agora'),
      presencaOficineiros: naAba('presenca', 'ofic'),
      presencaMedicao: naAba('presenca', 'med'),
      presencaJustificativas: naAba('presenca', 'just'),
      presencaHoras: false,
      agendasOficineiros: naAba('agendas', 'ofic'),
      agendasEscolas: naAba('agendas', 'esc'),
      agendasDia: naAba('agendas', 'dia'),
      agendasConsolidado: naAba('agendas', 'cons'),
      atividadesOficineiros: naAba('aulas', 'ofic'),
      atividadesLinha: naAba('aulas', 'linha'),
      atividadesPendentes: naAba('aulas', 'pend'),
      relatorios: s.tela === 'rel',
      contas: s.tela === 'contas',
      visaoSistema: s.ehAdmin && s.tela === 'adm',
      escolas: s.ehAdmin && s.tela === 'escolas',
      carteiras: s.ehAdmin && s.tela === 'carteiras',
      auditoria: s.ehAdmin && s.tela === 'auditoria',
      consulta: s.ehAdmin && s.tela === 'consulta',
      feriados: s.ehAdmin && s.tela === 'feriados',
      convites: s.ehAdmin && s.tela === 'convites',
      baseAcessos: s.ehAdmin && s.tela === 'baseAcessos',
      sistema: s.ehAdmin && s.tela === 'sistema',
      presenca: s.tela === 'presenca',
      agendas: s.tela === 'agendas',
      atividades: s.tela === 'aulas'
    };
    return { is };
  }
  contextoDasTelas(s, valores) {
    const contexto = {
      ...Base.escolher(s, ESTADO_DAS_TELAS),
      ...Base.escolher(valores, VALORES_DAS_TELAS),
      dataDoIso,
      segundaDaSemana,
      TIPOS_DE_ATIVIDADE,
      descricaoDoTipo,
      isoDaData,
      sextaDaSemana,
      setState: (...argumentos) => this.setState(...argumentos),
      salvarRaioDaEscola: (...argumentos) => this.salvarRaioDaEscola(...argumentos),
      carregarPresencasDoCiclo: (...argumentos) => this.carregarPresencasDoCiclo(...argumentos),
      baixarMedicao: (...argumentos) => this.baixarMedicao(...argumentos),
      baixarCsv: (...argumentos) => this.baixarCsv(...argumentos),
      hojeIso: (...argumentos) => this.hojeIso(...argumentos),
      estado: () => this.state,
      carregarJustificativas: (...argumentos) => this.carregarJustificativas(...argumentos),
      sinalizarJustificativa: (...argumentos) => this.sinalizarJustificativa(...argumentos),
      registrarConsulta: (...argumentos) => this.registrarConsulta(...argumentos),
      cicloBaseDosRelatorios: (...argumentos) => this.cicloBaseDosRelatorios(...argumentos),
      carregarRelatoriosDoCiclo: (...argumentos) => this.carregarRelatoriosDoCiclo(...argumentos),
      devolverRelatorio: (...argumentos) => this.devolverRelatorio(...argumentos),
      aprovarRelatorio: (...argumentos) => this.aprovarRelatorio(...argumentos),
      abrirGavetaDeConta: (...argumentos) => this.abrirGavetaDeConta(...argumentos),
      abrirLote: (...argumentos) => this.abrirLote(...argumentos),
      carregarContas: (...argumentos) => this.carregarContas(...argumentos),
      carregarAtividadesDoSistema: (...argumentos) => this.carregarAtividadesDoSistema(...argumentos),
      carregarErrosDoNavegador: (...argumentos) => this.carregarErrosDoNavegador(...argumentos),
      abrirGavetaDeAdmin: (...argumentos) => this.abrirGavetaDeAdmin(...argumentos),
      carregarAuditoria: (...argumentos) => this.carregarAuditoria(...argumentos),
      corrigirComoAdmin: (...argumentos) => this.corrigirComoAdmin(...argumentos),
      consultarAdmin: (...argumentos) => this.consultarAdmin(...argumentos),
      salvarFeriado: (...argumentos) => this.salvarFeriado(...argumentos),
      removerFeriado: (...argumentos) => this.removerFeriado(...argumentos),
      salvarConfiguracoes: (...argumentos) => this.salvarConfiguracoes(...argumentos),
      registrarExportador: exportador => (this.exportadorDaTela = exportador)
    };
    return { contexto };
  }
  chavesDoLote(s, valores) {
    const { lote, loteAtual } = valores;
    return {
      cliente: Base.cliente(),
      loteAberto: !!loteAtual,
      lote,
      erroLote: s.erroLote,
      temErroLote: !!s.erroLote,
      fecharLote: () => this.fecharLote(),
      baixarModelo: () => this.baixarModelo(),
      lerLote: e => this.lerLote(e),
      criarLote: () => this.criarLote()
    };
  }
  chavesDaAdministracao(s, valores) {
    return window.FSM_ADMINISTRACAO.chavesDaAdministracao.call(this, s, valores);
  }
  chavesDoCabecalho(s, valores) {
    const {
      exportarAtividades,
      is,
      menu,
      notificacoes,
      oficineirosVisiveis,
      opcoesDeEscola,
      opcoesDeOficineiro,
      opcoesDePeriodo,
      tabs,
      titulos
    } = valores;
    return {
      perfilTitulo: s.ehAdmin ? 'Administrador' : 'Coordenador do núcleo',
      temSino: !s.ehAdmin,
      ...window.FSM_NOTIF.sino(this, 'coordenador', notificacoes, () => {
        this.setState({ notificacoesAbertas: true, menuAberto: false });
      }),
      notifAberto: !!s.notificacoesAbertas,
      fecharNotif: () => this.setState({ notificacoesAbertas: false }),
      temFiltros: ['aulas', 'rel', 'prod'].includes(s.tela) && s.conectado,
      periodo: s.periodoDasAtividades,
      opcoesDePeriodo,
      escolherPeriodo: e =>
        this.setState({ periodoDasAtividades: e.target.value, acoesDeRevisao: {} }, () =>
          this.carregarAtividadesDosOficineiros()
        ),
      escola: s.escolaDasAtividades,
      opcoesDeEscola,
      escolherEscola: e =>
        this.setState({ escolaDasAtividades: e.target.value, oficineiroFiltrado: '', limiteDeAtividades: 50 }),
      oficineiro: s.oficineiroFiltrado,
      opcoesDeOficineiro,
      todosOsOficineiros: 'Todos os oficineiros (' + oficineirosVisiveis.length + ')',
      escolherOficineiro: e =>
        this.setState({
          oficineiroFiltrado: e.target.value,
          oficineiroDasAtividades: e.target.value || s.oficineiroDasAtividades,
          limiteDeAtividades: 50
        }),
      exportarPdf: () => {
        try {
          window.print();
        } catch (x) {
          this.avisar('Não foi possível abrir a impressão neste navegador');
        }
      },
      exportarExcel: exportarAtividades,
      menu,
      titulo: titulos[s.tela],
      abas: tabs,
      temAbas: !!ABAS_POR_TELA[s.tela],
      temConfig: typeof window.fsmConfiguracoes === 'function',
      abrirConfig: () => {
        if (this.state.menuAberto) this.setState({ menuAberto: false });
        if (typeof window.fsmConfiguracoes === 'function') window.fsmConfiguracoes();
      },
      temSair: typeof window.fsmSair === 'function',
      sairConta: () => {
        if (typeof window.fsmSair === 'function') window.fsmSair();
      },
      menuClasse: s.menuAberto ? 'open' : '',
      abrirMenu: () => this.setState({ menuAberto: true }),
      fecharMenu: () => this.setState({ menuAberto: false }),
      is,
      contextoDaJornada: s.tela === 'jornada' ? this.contextoDaJornada(s) : {},
      memoriaJornada: this.memoriaJornada || (this.memoriaJornada = {}),
      exportarRelatorios: () => this.exportadorDaTela && this.exportadorDaTela(),
      mostrarRelatorios: s.tela === 'rel' && s.conectado
    };
  }
  chavesDasContas(s, valores) {
    return window.FSM_GESTAO_CONTAS.chavesDasContas.call(this, s, valores);
  }
}
</script>
</body>
</html>
