      campo = 'adm-esc-nome';
    } else if ((lat === '') !== (lng === '')) {

        const el = document.getElementById(campo);
        if (el) el.focus();
      });

    }

  valoresDeApoio(s) {

            escolaTitulo: escolaEditada ? (escolaEditada.id ? escolaEditada.nome || 'Escola' : 'Nova escola') : '',
            escolaEditada: escolaEditada
              ? {
                  ...escolaEditada,
                  escreverSigla: definirNaEscola('sigla'),
                  escreverNome: definirNaEscola('nome'),
                  escreverEndereco: definirNaEscola('endereco'),
                  escreverTelefone: definirNaEscola('telefone'),
                  escolherCarteira: definirNaEscola('carteira_id'),
                  escreverLatitude: definirNaEscola('latitude'),
                  escreverLongitude: definirNaEscola('longitude'),
                  escreverRaio: definirNaEscola('raio_m'),
                  marcarAtiva: definirNaEscola('ativa')
                }
              : {},
            opcoesDeCarteira: carts.map(c => ({ valor: c.id, rotulo: c.rotulo })),
            salvarEscola: () => this.salvarEscola(),
            escolaBotao: s.salvandoSistema
              ? 'Salvando…'
              : escolaEditada && escolaEditada.id
                ? 'Salvar alterações'
                : 'Cadastrar escola',
            turmas:
              escolaEditada && escolaEditada.id
                ? turmasDe(escolaEditada.id).map(t => {
                    const raio =
                      s.turmasEditadas[t.id] != null
                        ? s.turmasEditadas[t.id]
                        : t.matriculados == null
                          ? ''
                          : String(t.matriculados);
                    return {
                      nome: anoTxt(t.ano) + (t.turma ? ' · Turma ' + t.turma : ''),
                      matriculados: raio,
                      aria: 'Matriculados de ' + anoTxt(t.ano) + (t.turma ? ' turma ' + t.turma : ''),
                      escreverMatriculados: e =>
                        this.setState({ turmasEditadas: { ...this.state.turmasEditadas, [t.id]: e.target.value } }),
                      mudou: raio !== (t.matriculados == null ? '' : String(t.matriculados)),
                      salvar: () => this.salvarTurma({ id: t.id, ano: t.ano, turma: t.turma, matr: raio }),
                      remover: () => this.removerTurma(t),
                      removerTexto: s.turmaARemover === t.id ? 'Confirmar remoção' : 'Remover',
                      removerCor: s.turmaARemover === t.id ? 'var(--destaque-branco)' : 'var(--texto-vermelho-600)',
                      removerClasse: s.turmaARemover === t.id ? '' : 'fundo-branco',
                      removerFundo: s.turmaARemover === t.id ? 'var(--destaque-vermelho-600)' : 'var(--fundo-branco)'
                    };
                  })
                : [],
            semTurmas: !!(escolaEditada && escolaEditada.id && !turmasDe(escolaEditada.id).length),
            novaTurma: {
              ...novaTurma,
              escolherAno: definirNaTurma('ano'),
              escreverTurma: definirNaTurma('turma'),
              escreverMatriculados: definirNaTurma('matr')
            },
            opcoesDeAno: ANOS.map(a => ({ valor: String(a), rotulo: anoTxt(a) })),
            incluirTurma: () => this.salvarTurma({ ano: novaTurma.ano, turma: novaTurma.turma, matr: novaTurma.matr }),
            carteiraAberta: !!cart,
            carteiraNova: !!(cart && cart.nova),
            carteiraEditada: cart
              ? { ...cart, escreverCodigo: definirNaCarteira('id'), escreverRotulo: definirNaCarteira('rotulo') }
              : {},
            salvarCarteira: () => this.salvarCarteira(),
            carteiraBotao: s.salvandoSistema
              ? 'Salvando…'
              : cart && cart.nova
                ? 'Cadastrar carteira'
                : 'Salvar alterações',
            registroAberto: !!ev,
            registro: ev
              ? {
                  titulo: ACAO[ev.acao] || ev.acao,
                  itens: [
                    ['Quando', dataHora(ev.em, true) + ' (horário de Brasília)'],
                    ['Quem', quem(ev)],
                    ['ID da conta', ev.usuario_id || '—'],
                    ['Onde', onde(ev)],
                    ['Registro alterado', ev.registro ? (ehUuid(ev.registro) ? 'ID ' : 'nº ') + ev.registro : '—'],
                    ['Código do evento', String(ev.id)]
                  ].map(([l, v]) => ({ rotulo: l, valor: v })),
                  campos: campos(ev, true),
                  semCampos: !campos(ev, true).length
                }
              : {},
            presencaAberta: !!presencaEditada,
            presencaEditada: presencaEditada
              ? {
                  ...presencaEditada,
                  pessoa: perfilDaConsulta ? perfilDaConsulta.nome : '',
                  titulo: presencaEditada.nova ? 'Lançar presença' : 'Presença de ' + dmaIso(presencaEditada.data),
                  max: hojeSP,
                  escreverMotivo: definirNaPresenca('motivo'),
                  escolherData: definirNaPresenca('data'),
                  escreverInicio: definirNaPresenca('ini'),
                  escreverFim: definirNaPresenca('fim'),
                  salvarHorarios: () => this.salvarHorariosPresenca(),
                  botao: s.salvandoSistema ? 'Salvando…' : presencaEditada.nova ? 'Lançar presença' : 'Salvar horários',
                  existe: !presencaEditada.nova && !!presencaAtual,
                  resumo: presencaAtual
                    ? 'Trabalhado ' + minTxt(presencaAtual.trabalhado_min) + ' · limite de 8h por dia'
                    : ''
                }
              : {},
            fecharGaveta: () => this.fecharGavetaDeAdmin(),
            erroGaveta: s.erroDaGaveta,
            temErroGaveta: !!s.erroDaGaveta,
            salvando: !!s.salvandoSistema,
            temAdministracao: !!(
              contaAdministrada &&
              !contaAdministrada.eu &&
              contaAdministrada.papel !== 'administrador'
            ),
            administracao: contaAdministrada
              ? {
                  motivo: acaoDeAdmin.motivo || '',
                  escreverMotivo: definirNaAcao('motivo'),
                  perfil: papelDaAcao,
                  escolherPerfil: definirNaAcao('papel'),
                  escola: escolaDaAcao,
                  escolherEscola: definirNaAcao('escola'),
                  carteira: carteiraDaAcao,
                  escolherCarteira: definirNaAcao('carteira'),
                  pedeEscola: papelDaAcao === 'oficineiro' || papelDaAcao === 'direcao',
                  pedeCarteira: papelDaAcao === 'analista',
                  mudou: acaoMudou,
                  salvarPerfil: () => this.executarAcaoDeConta(contaAdministrada, 'papel'),
                  podeExigirSenha:
                    !!contaAdministrada.usuario && !contaAdministrada.trocar_senha && contaAdministrada.ativo,
                  senhaPendente: !!contaAdministrada.trocar_senha && !!contaAdministrada.usuario,
                  exigirSenha: () => this.executarAcaoDeConta(contaAdministrada, 'senha'),
                  podeRedefinirAutenticador: contaAdministrada.ativo,
                  redefinirAutenticador: () => this.executarAcaoDeConta(contaAdministrada, 'mfa'),
                  nome: contaAdministrada.nome,
                  apagando: !!s.confirmandoRemocao,
                  apagarBotao: s.salvandoConta && s.confirmandoRemocao ? 'Apagando…' : 'Apagar definitivamente',
                  pedirApagar: () =>
                    this.setState({ confirmandoRemocao: true, erroConta: '' }, () => {
                      const b = document.getElementById('ct-adm-apagar-confirma');
                      if (b) b.focus();
                    }),
                  cancelarApagar: () =>
                    this.setState({ confirmandoRemocao: false }, () => {
                      const b = document.getElementById('ct-adm-apagar');
                      if (b) b.focus();
                    }),
                  apagar: () => this.executarAcaoDeConta(contaAdministrada, 'apagar'),
                  ...(() => {
                    const em = s.emailRevelado && s.emailRevelado.id === contaAdministrada.id ? s.emailRevelado : null;
                    const tem = !!(em && em.valor != null);
                    return {
                      emailOculto: !tem,
                      mostrarEmail: tem && !em.editando,
                      editandoEmail: tem && !!em.editando,
                      email: tem ? em.valor || 'Sem e-mail cadastrado' : '',
                      novoEmail: em && em.novo != null ? em.novo : '',
                      carregandoEmail: !!(em && em.carregando),
                      verEmailBotao: em && em.carregando ? 'Carregando…' : 'Mostrar e-mail',
                      salvarEmailBotao: s.salvandoConta && em && em.editando ? 'Salvando…' : 'Salvar e-mail',
                      verEmail: () => this.verEmailDaConta(contaAdministrada),
                      editarEmail: () =>
                        this.setState(
                          { emailRevelado: { ...em, editando: true, novo: em.valor || '' }, erroConta: '' },
                          () => {
                            const el = document.getElementById('ct-adm-email');
                            if (el) el.focus();
                          }
                        ),
                      escreverNovoEmail: e =>
                        this.setState({
                          emailRevelado: { ...this.state.emailRevelado, novo: e.target.value },
                          erroConta: ''
                        }),
                      cancelarEmail: () =>
                        this.setState({ emailRevelado: { ...em, editando: false, novo: null }, erroConta: '' }, () => {
                          const b = document.getElementById('ct-adm-email-alterar');
                          if (b) b.focus();
                        }),
                      salvarEmail: () => this.executarAcaoDeConta(contaAdministrada, 'email')
                    };
                  })()
                }
              : {},
            opcoesDePerfil: [
              ['oficineiro', 'Oficineiro de Inclusão Digital'],
              ['direcao', 'Direção da escola'],
              ['analista', 'Analista'],
              ['coordenador', 'Coordenador'],
              ['gerente', 'Gerente de Projetos']
            ].map(([v, l]) => ({ valor: v, rotulo: l })),
            opcoesDeEscolaAtiva: escAtivas.map(e => ({ valor: String(e.id), rotulo: e.nome }))
          }
        : { temAdministracao: false })
    };
  }
  chavesDoCabecalho(s, valores) {
    const {
      exportarAtividades,
      is,
      menu,
      notificacoes,
      oficineirosVisiveis,
      opcoesDeEscola,
      opcoesDeOficineiro,
      opcoesDePeriodo,
      tabs,
      titulos
    } = valores;
    return {
      perfilTitulo: s.ehAdmin ? 'Administrador' : 'Coordenador do núcleo',
      temSino: !s.ehAdmin,
      ...window.FSM_NOTIF.sino(this, 'coordenador', notificacoes, () => {
        this.setState({ notificacoesAbertas: true, menuAberto: false });
      }),
      notifAberto: !!s.notificacoesAbertas,
      fecharNotif: () => this.setState({ notificacoesAbertas: false }),
      temFiltros: ['aulas', 'rel', 'prod'].includes(s.tela) && s.conectado,
      periodo: s.periodoDasAtividades,
      opcoesDePeriodo,
      escolherPeriodo: e =>
        this.setState({ periodoDasAtividades: e.target.value, acoesDeRevisao: {} }, () =>
          this.carregarAtividadesDosOficineiros()
        ),
      escola: s.escolaDasAtividades,
      opcoesDeEscola,
      escolherEscola: e =>
        this.setState({ escolaDasAtividades: e.target.value, oficineiroFiltrado: '', limiteDeAtividades: 50 }),
      oficineiro: s.oficineiroFiltrado,
      opcoesDeOficineiro,
      todosOsOficineiros: 'Todos os oficineiros (' + oficineirosVisiveis.length + ')',
      escolherOficineiro: e =>
        this.setState({
          oficineiroFiltrado: e.target.value,
          oficineiroDasAtividades: e.target.value || s.oficineiroDasAtividades,
          limiteDeAtividades: 50
        }),
      exportarPdf: () => {
        try {
          window.print();
        } catch (x) {
          this.avisar('Não foi possível abrir a impressão neste navegador');
        }
      },
      exportarExcel: exportarAtividades,
      menu,
      titulo: titulos[s.tela],
      abas: tabs,
      temAbas: !!ABAS_POR_TELA[s.tela],
      temConfig: typeof window.fsmConfiguracoes === 'function',
      abrirConfig: () => {
        if (this.state.menuAberto) this.setState({ menuAberto: false });
        if (typeof window.fsmConfiguracoes === 'function') window.fsmConfiguracoes();
      },
      temSair: typeof window.fsmSair === 'function',
      sairConta: () => {
        if (typeof window.fsmSair === 'function') window.fsmSair();
      },
      menuClasse: s.menuAberto ? 'open' : '',
      abrirMenu: () => this.setState({ menuAberto: true }),
      fecharMenu: () => this.setState({ menuAberto: false }),
      is,
      exportarRelatorios: () => this.exportadorDaTela && this.exportadorDaTela(),
      mostrarRelatorios: s.tela === 'rel' && s.conectado
    };
  }
  chavesDasContas(s, valores) {
    const {
      contaAberta,
      contexto,
      dataMaximaDaMudanca,
      dataMinimaDaMudanca,
      detalheDaConta,
      escolaDaMudanca,
      escolasAtivas,
      mudanca,
      mudarMudanca,
      mudarNova,
      nomeDaEscola,
      nova,
      perfisDaNovaConta,
      teclaNosPerfis
    } = valores;
    return {
      fecharConta: () => this.fecharGavetaDeConta(),
      novaContaAberta: !!s.novaConta,
      novaConta: {
        nome: nova.nome || '',
        telefone: nova.telefone || '',
        email: nova.email || '',
        cpf: nova.cpf || '',
        escola: nova.escola || '',
        carteira: nova.carteira || '',
        jornada: nova.jornada || '07:00',
        setJornada: mudarNova('jornada'),
        contratada: nova.contratada || '',
        escreverContratada: mudarNova('contratada'),
        escreverNome: mudarNova('nome'),
        escreverTelefone: mudarNova('telefone'),
        escreverEmail: mudarNova('email'),
        escreverCpf: mudarNova('cpf'),
        escolherEscola: mudarNova('escola'),
        escolherCarteira: mudarNova('carteira')
      },
      perfisDaNovaConta,
      dicaDePerfil: s.ehAdmin
        ? 'Contas de coordenador e de gerente veem toda a rede. Crie só para quem precisa.'
        : 'Contas de coordenador são criadas pelo Gerente de Projetos.',
      teclaNosPerfis,
      pedeEscola: nova.papel === 'oficineiro' || nova.papel === 'direcao',
      ehOficineiro: nova.papel === 'oficineiro',
      ehAnalista: nova.papel === 'analista',
      opcoesDeEscolaDaConta: escolasAtivas.map(e => ({ valor: e.sigla, rotulo: e.nome })),
      opcoesDeCarteiraDaConta: (s.carteiras || []).map(c => ({ valor: c.id, rotulo: c.rotulo })),
      erroNovaConta: s.erroConta,
      temErroNovaConta: !!s.erroConta,
      criarConta: () => this.criarConta(),
      novaContaBotao: s.salvandoConta ? 'Criando…' : 'Criar usuário',
      salvandoConta: s.salvandoConta,
      contaAberta: !!contaAberta,
      conta: detalheDaConta,
      confirmandoDesativacao: s.confirmandoDesativacao,
      erroConta: s.erroConta,
      temErroConta: !!(contaAberta && s.erroConta),
      mudancaAberta: !!s.mudanca,
      mudanca: {
        nome: mudanca.nome || '',
        atual: nomeDaEscola(mudanca.atual) || '—',
        escola: mudanca.escola || '',
        vale: mudanca.vale || '',
        motivo: mudanca.motivo || '',
        agora: !!mudanca.agora,
        comData: !mudanca.agora,
        escolherEscola: mudarMudanca('escola'),
        escolherData: mudarMudanca('vale'),
        escreverMotivo: mudarMudanca('motivo'),
        marcarAgora: e =>
          this.setState({ mudanca: { ...this.state.mudanca, agora: e.target.checked }, erroMudanca: '' })
      },
      opcoesDeEscolaDaMudanca: escolasAtivas
        .filter(e => e.id !== mudanca.atual)
        .map(e => ({ valor: String(e.id), rotulo: e.nome })),
      enderecoDaMudanca: escolaDaMudanca && escolaDaMudanca.endereco ? escolaDaMudanca.endereco : '',
      temEnderecoDaMudanca: !!(escolaDaMudanca && escolaDaMudanca.endereco),
      mudancaMinima: Base.iso(
        new Date(dataMinimaDaMudanca.getFullYear(), dataMinimaDaMudanca.getMonth(), dataMinimaDaMudanca.getDate() + 1)
      ),
      mudancaMaxima: Base.iso(dataMaximaDaMudanca),
      erroMudanca: s.erroMudanca,
      temErroMudanca: !!s.erroMudanca,
      salvarMudanca: () => this.salvarMudanca(),
      mudancaBotao: s.salvandoConta ? 'Salvando…' : mudanca.agora ? 'Alterar agora' : 'Salvar alteração',
      aviso: s.aviso,
      contexto
    };
  }
}
</script>
</body>
</html>
