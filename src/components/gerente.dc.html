<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficineiro+ · Gerente de Projetos</title>
<script src="../vendor/dc-runtime/dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles/app.css">
<style>
@media (max-width: 900px) {
  .pagina {
    padding: 14px 14px 90px !important;
    gap: 14px !important;
  }
  .filtros > select,
  .filtros > input {
    flex: 1 1 140px;
    min-width: 0 !important;
  }
  .ranking-linha {
    grid-template-columns: minmax(0, 1fr) 48px !important;
  }
  .ranking-linha > .ranking-extra {
    grid-column: 1/-1;
  }
}
[role="table"] {
  position: relative;
}
@media (max-width: 900px) {
  .ct-tab [role="table"] {
    min-width: 0 !important;
  }
}
@media print {
  .menu-lateral,
  .veu,
  .botao-menu,
  .sino-celular,
  .filtros {
    display: none !important;
  }
  .estrutura {
    display: block !important;
  }
  .cabecalho {
    position: static !important;
  }
  body {
    background: #fff !important;
  }
  .pagina {
    padding: 0 !important;
    max-width: none !important;
  }
}
</style>
<script src="./lib/onboarding.js"></script>
</helmet>
<div class="estrutura d-grid colunas-236-minmax-0-1fr min-h-100vh">
  <dc-import name="menu" navCls="{{ menuClasse }}" closeNav="{{ fecharMenu }}" perfilTitulo="Gerente de Projetos" perfilLinha="{{ linhaDoPerfil }}" menu="{{ menu }}" abrirNotif="{{ abrirNotif }}" notifAria="{{ notifAria }}" temNotif="{{ temNotif }}" notifN="{{ notifN }}" temConfig="{{ temConfig }}" abrirConfig="{{ abrirConfig }}" temSair="{{ temSair }}" sairConta="{{ sairConta }}"></dc-import>

  <main class="min-w-0 d-flex eixo-column">
    <dc-import name="cabecalho" espacamento="gap-12-16 p-10-28" blocoClasse="cabecalho-titulo min-w-0" trilha="{{ trilha }}" cortaTrilha="{{ true }}" tituloClasse="espaco-nowrap rolagem-hidden reticencias-ellipsis" abrirMenu="{{ abrirMenu }}" titulo="{{ titulo }}" abrirNotif="{{ abrirNotif }}" notifAria="{{ notifAria }}" temNotif="{{ temNotif }}" notifN="{{ notifN }}"></dc-import>
<dc-import name="notificacoes" gavetas="{{ gavetaDeNotificacoes }}"></dc-import>

    <div class="pagina p-28 d-flex eixo-column gap-20 max-w-1320 w-100pc">
<sc-if value="{{ temErro }}" hint-placeholder-val="{{ false }}"><div role="alert" class="fundo-vermelho-50 cor-vermelho-720 raio-10 p-12-14 fs-13 d-flex quebra-wrap alinha-center gap-8-14"><span class="flex-1 min-w-200">{{ erro }}</span><button onClick="{{ tentarDeNovo }}" class="h-34 borda-1-solid-b42318 fundo-branco cor-vermelho-600 raio-8 p-0-12 fs-13 fw-600">Tentar de novo</button></div></sc-if>
<sc-if value="{{ semLogin }}" hint-placeholder-val="{{ false }}"><div class="borda-cinza-110 raio-12 p-24 texto-center cor-cinza-600 fs-14 lh-1p5 fundo-branco" style="background:var(--fundo-branco)">Entre com a conta do Gerente de Projetos para ver os dados da rede.</div></sc-if>

<sc-if value="{{ temFiltros }}" hint-placeholder-val="{{ true }}">
  <div class="filtros d-flex quebra-wrap gap-8 alinha-center" role="search" aria-label="Filtros da rede">
    <sc-if value="{{ filtroDeCiclo }}" hint-placeholder-val="{{ true }}"><select aria-label="Ciclo" value="{{ ciclo }}" onChange="{{ escolherCiclo }}" class="h-38 borda-cinza-160 raio-8 p-0-10 fs-13 fw-600 fundo-branco" style="background:var(--fundo-branco)"><sc-for list="{{ opcoesDeCiclo }}" as="opcao" hint-placeholder-count="4"><option value="{{ opcao.valor }}">{{ opcao.rotulo }}</option></sc-for></select></sc-if>
    <select aria-label="Carteira" value="{{ carteira }}" onChange="{{ escolherCarteira }}" class="h-38 borda-cinza-160 raio-8 p-0-10 fs-13 max-w-260 largura-fundo fundo-branco" style="background:var(--fundo-branco)"><option value="">Todas as carteiras</option><sc-for list="{{ opcoesDeCarteira }}" as="opcao" hint-placeholder-count="6"><option value="{{ opcao.valor }}">{{ opcao.rotulo }}</option></sc-for></select>
    <select aria-label="Escola" value="{{ escola }}" onChange="{{ escolherEscola }}" class="h-38 borda-cinza-160 raio-8 p-0-10 fs-13 max-w-300 largura-fundo fundo-branco" style="background:var(--fundo-branco)"><option value="">{{ todasAsEscolas }}</option><sc-for list="{{ opcoesDeEscola }}" as="opcao" hint-placeholder-count="8"><option value="{{ opcao.valor }}">{{ opcao.rotulo }}</option></sc-for></select>
    <sc-if value="{{ filtroDeCiclo }}" hint-placeholder-val="{{ true }}"><span role="status" aria-live="polite" class="fs-12 cor-cinza-600">{{ periodoTexto }}</span></sc-if>
    <sc-if value="{{ temFiltro }}" hint-placeholder-val="{{ false }}"><button onClick="{{ limparFiltros }}" class="borda-0 fundo-transparent p-0 min-h-0 fs-13 fw-600 cor-ciano-740 deco-underline botao-texto">Limpar filtros</button></sc-if>
  </div>
</sc-if>

<sc-if value="{{ temAbas }}" hint-placeholder-val="{{ false }}">
  <div class="nao-imprimir d-flex quebra-wrap gap-10-12 alinha-center">
    <div role="tablist" aria-label="{{ abasAria }}" class="largura-total-celular d-flex gap-4 fundo-cinza-90 p-4 raio-10 rolagem-x-auto segmentado"><sc-for list="{{ abas }}" as="aba" hint-placeholder-count="2"><button role="tab" aria-selected="{{ aba.marcado }}" onClick="{{ aba.escolher }}" class="borda-0 raio-7 p-8-14 fs-14 fw-600 espaco-nowrap {{ aba.classe }}" style="background:{{ aba.fundo }};color:{{ aba.cor }}">{{ aba.rotulo }}</button></sc-for></div>
    <div class="oculto-celular flex-1"></div>
    <sc-if value="{{ temExportar }}" hint-placeholder-val="{{ false }}"><button onClick="{{ imprimir }}" class="h-36 borda-cinza-160 fundo-branco raio-8 p-0-12 fs-13 fw-600 cor-ciano-850 botao-secundario">Imprimir / PDF</button><button onClick="{{ exportarExcel }}" class="h-36 borda-cinza-160 fundo-branco raio-8 p-0-12 fs-13 fw-600 cor-ciano-850 botao-secundario">Exportar Excel</button></sc-if>
  </div>
</sc-if>

<sc-if value="{{ is.geral }}" hint-placeholder-val="{{ true }}"><dc-import name="gerente-geral" contexto="{{ contexto }}" memoria="{{ memoriaGeral }}"></dc-import></sc-if>
<sc-if value="{{ is.adocao }}" hint-placeholder-val="{{ false }}"><dc-import name="gerente-adocao" contexto="{{ contexto }}" memoria="{{ memoriaAdocao }}"></dc-import></sc-if>
<sc-if value="{{ is.oficineiros }}" hint-placeholder-val="{{ false }}"><dc-import name="gerente-oficineiros" contexto="{{ contexto }}"></dc-import></sc-if>
<sc-if value="{{ is.analistas }}" hint-placeholder-val="{{ false }}"><dc-import name="gerente-analistas" contexto="{{ contexto }}" memoria="{{ memoriaAnalistas }}"></dc-import></sc-if>
<sc-if value="{{ is.jornada }}" hint-placeholder-val="{{ false }}"><dc-import name="jornada" perfil="gerente" contexto="{{ contexto }}" memoria="{{ memoriaJornada }}"></dc-import></sc-if>
<sc-if value="{{ is.onboarding }}" hint-placeholder-val="{{ false }}"><dc-import name="gerente-onboarding" contexto="{{ contexto }}" memoria="{{ memoriaOnboarding }}"></dc-import></sc-if>
<sc-if value="{{ is.contas }}" hint-placeholder-val="{{ false }}"><dc-import name="gerente-contas" contexto="{{ contexto }}" memoria="{{ memoriaContas }}"></dc-import></sc-if>

    </div>
  </main>
</div>


<dc-import name="gerente-gavetas" gavetas="{{ gavetasDoGerente }}"></dc-import>


<dc-import name="contas-gavetas" gavetas="{{ gavetasDeContas }}"></dc-import>




<div class="sr-only" role="status" aria-live="polite">{{ aviso }}</div>
<sc-if value="{{ aviso }}" hint-placeholder-val="{{ false }}">
  <div aria-hidden="true" class="pos-fixed base-96 esquerda-50pc w-max-content fundo-ciano-880 cor-branco p-12-18 raio-10 fs-14 z-95 sombra-0-8-24-rgba-0-0-0-0p2 largura-fundo" style="transform:translateX(-50%);max-width:calc(100% - 32px)">{{ aviso }}</div>
</sc-if>
</x-dc>

const Base = window.FSM_BASE;
const ESTADO_DAS_TELAS = [

];
const Contas = window.FSM_CONTAS;
const CHAVES_DAS_GAVETAS = [

  'conta',
  'contaAberta',
  'dataMaxima',
  'dataMinima',
  'erroConta',

];
const {
  TIPOS,
  MESES,
  WDL: DIAS,
  VIS_FOCOS,
  p2,
  dataDe,
  hojeIso,
  agoraMin,
  hmDe,
  dmIso,
  dmyIso,
  mesIni,
  cicloIniIso,
  cicloFimIso,
  mesTxt,
  segDe,
  turmaTxt,
  detTipo,
  pct,
  plural,
  msgErro,
  normTxt,
  prazoDe,
  proxUtil,
  agregar
} = Base;
const NOMES_DE_PERFIL = {
  oficineiro: 'Oficineiro de Inclusão Digital',
  analista: 'Analista',
  direcao: 'Direção da escola',
  coordenador: 'Coordenador',
  gerente: 'Gerente de Projetos',
  administrador: 'Administrador'
};
const SITUACOES_DE_CONTA = {
  ativa: ['Ativo', 'var(--texto-verde-700)', 'var(--fundo-verde-80)'],
  primeiro: ['Aguardando 1º acesso', 'var(--texto-ambar-745)', 'var(--fundo-ambar-80)'],
  desativada: ['Desativado', 'var(--texto-cinza-600)', 'var(--fundo-cinza-70)']
};
const ORIGENS_DE_VISITA = Base.ORIGEM_VISITA;
const FAIXAS_DE_EXECUCAO = [
  ['No ritmo', '≥ 90%', 'var(--texto-verde-700)', 'var(--fundo-verde-80)', v => v >= 90],
  ['Estável', '75–89%', 'var(--texto-indigo-360)', 'var(--fundo-indigo-50)', v => v >= 75 && v < 90],
  ['Atenção', '50–74%', '#E0892B', 'var(--fundo-ambar-80)', v => v >= 50 && v < 75],
  ['Reforçar apoio', '< 50%', 'var(--texto-vermelho-600)', 'var(--fundo-vermelho-50)', v => v < 50]
];
const ATENDIMENTOS_DE_VISITA = Base.ATEND_VISITA;
const cicloDe = (iso, k) => {
  const c = Base.cicloComp(dataDe(iso));
  return Base.iso(new Date(c.getFullYear(), c.getMonth() + (k || 0), 1));
};
const nomeDoMes = iso => MESES[Number(String(iso).slice(5, 7)) - 1];
const minutosValidos = p => Base.minutosValidos(p);
const minutosExcedentes = p =>
  Base.presencaFechada(p) ? Math.max(0, (p.trabalhado_min || 0) - Base.MINUTOS_DO_DIA) : 0;
const documentoValido = Contas.documentoValido;
class Component extends DCLogic {
  state = {
    menuAberto: false,
    tela: 'geral',
    abas: { adocao: 'cons', ofic: 'pres', anal: 'cart' },
    conectado: false,
    carregando: false,
    erro: '',
    salvando: false,
    aviso: '',
    escolas: [],
    carteiras: [],
    contas: [],
    mudancasDeEscola: [],
    presencasRede: [],
    aulasRede: [],
    grade: [],
    gradeAnterior: [],
    envios: [],
    relatorios: null,
    relatoriosPorCiclo: {},
    visitas: [],
    presencasAnalistas: [],
    agenda: [],
    ciclos: {},
    cicloFiltro: '',
    carteiraFiltro: '',
    escolaFiltro: '',
    registroAberto: null,
    novaVisita: null,
    erroNovaVisita: '',
    visitaAberta: null,
    semanas: {},
    confirmandoCancelamento: false,
    acessos: null,
    carregandoAcessos: false,
    ordensServico: null,
    onboardings: null,
    previaDaOs: null,
    erroOnboarding: '',
    resultadoDaOs: '',
    carregandoContas: false,
    erroContas: '',
    novaConta: null,
    contaAberta: null,
    mudanca: null,
    confirmandoDesativacao: false,
    erroConta: '',
    erroMudanca: '',
    contratadas: {},
    contratadaEditada: null,
    salvandoContratada: false,
    salvandoConta: false,
    lote: null,
    erroLote: ''
  };
  memoria = {
    geral: { relatoriosAbertos: false },
    adocao: { corte: 'carteira', oficineiro: '', tipo: '', solucao: '', situacao: '', busca: '', limite: 100 },
    analistas: { analista: '', semana: 0, agenda: 'anal' },
    jornada: {},
    onboarding: { filtro: { ordem: '', carteira: '', situacao: 'pendente' } },
    contas: { busca: '', perfil: '', carteira: '', escola: '', situacao: '', limite: 50 }
  };
  componentDidMount() {
    this.aoTeclar = e => {
      if (e.key !== 'Escape') return;
      const s = this.state;
      if (s.notifAberto) return this.setState({ notifAberto: false });
      if (s.lote) return this.fecharLote();
      if (s.novaVisita) return this.fecharNovaVisita();
      if (s.visitaAberta) return this.fecharVisita();
      if (s.registroAberto) return this.fecharRegistro();
      if (s.novaConta || s.contaAberta || s.mudanca) return this.fecharGavetaDeConta();
    };
    document.addEventListener('keydown', this.aoTeclar);
    this.relogio = setInterval(() => this.forceUpdate(), 60000);
    this.carregar();
  }
  componentWillUnmount() {
    document.removeEventListener('keydown', this.aoTeclar);
    clearInterval(this.relogio);
    clearTimeout(this.temporizadorDoAviso);
  }
  avisar(t) {
    return Contas.avisar.call(this, t);
  }
  lembrar(tela, mudanca) {
    Object.assign(this.memoria[tela], mudanca);
    this.forceUpdate();
  }
  abrirContas(filtro) {
    Object.assign(this.memoria.contas, { perfil: '', situacao: '', busca: '', escola: '', carteira: '', ...filtro });
    this.irPara('contas');
  }
  focar(id) {
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.focus();
    }, 30);
  }
  async carregar() {
    const A = window.FSM_AUTH;
    if (!A || !A.logado || !A.logado()) return;
    if (!A.agendaVisitas || !A.contasGestao) {
      this.setState({
        conectado: true,
        erro: 'Esta versão do site está desatualizada. Gere e publique o site de novo.'
      });
      return;
    }
    this.setState({ conectado: true, carregando: true, erro: '' });
    const hoje = hojeIso(),
      ini = cicloIniIso(cicloDe(hoje, -1)),
      ano = Number(hoje.slice(0, 4)),
      anoIni = Number(ini.slice(0, 4));
    try {
      const [escolas, carteiras, contas, mud, pres, aulas, grade, gradeAnt, envios, visitas, presA] = await Promise.all(
        [
          A.escolas(),
          A.carteiras(),
          A.contasGestao(),
          A.mudancasEscola().catch(() => []),
          A.presencasRede(ini, hoje),
          A.aulasRede(ini, hoje),
          A.gradeRede(ano),
          anoIni !== ano ? A.gradeRede(anoIni) : Promise.resolve([]),
          A.envioDaGrade(ano).catch(() => []),
          A.visitasPeriodo(ini, hoje).catch(() => []),
          A.presencasAnalista ? A.presencasAnalista(ini, hoje).catch(() => []) : Promise.resolve([])
        ]
      );
      this.setState(
        {
          escolas: escolas || [],
          carteiras: carteiras || [],
          contas: Array.isArray(contas) ? contas : [],
          mudancasDeEscola: mud || [],
          presencasRede: pres || [],
          aulasRede: aulas || [],
          grade: grade || [],
          gradeAnterior: gradeAnt || [],
          envios: envios || [],
          visitas: visitas || [],
          presencasAnalistas: presA || [],
          carregando: false,
          cicloFiltro: this.state.cicloFiltro || cicloDe(hoje, 0)
        },
        () => {
          this.carregarAgenda();
          this.carregarRelatorios();
          this.carregarOnboarding(true);
          this.carregarContratadas();
        }
      );
    } catch (x) {
      this.setState({ carregando: false, erro: msgErro(x, 'Não foi possível carregar os dados da rede.') });
    }
  }
  async carregarSemana(seg) {
    const A = window.FSM_AUTH;
    if (!A || !A.visitasCompletas || !A.aulasRede) return;
    this.semanasPedidas = this.semanasPedidas || new Set();
    if (this.semanasPedidas.has(seg)) return;
    this.semanasPedidas.add(seg);
    const fim = Base.iso(Base.add(dataDe(seg), 4));
    try {
      const [visitas, aulas] = await Promise.all([A.visitasCompletas(seg, fim), A.aulasRede(seg, fim)]);
      this.setState({ semanas: { ...this.state.semanas, [seg]: { visitas: visitas || [], aulas: aulas || [] } } });
    } catch (x) {
      this.semanasPedidas.delete(seg);
      this.setState({
        semanas: {
          ...this.state.semanas,
          [seg]: { visitas: [], aulas: [], erro: msgErro(x, 'Não foi possível carregar a semana.') }
        }
      });
    }
  }
  async carregarAgenda() {
    const A = window.FSM_AUTH,
      hoje = hojeIso();
    try {
      const ag = await A.agendaVisitas(mesIni(hoje, -6), Base.iso(Base.add(dataDe(hoje), 190)));
      this.semanasPedidas = new Set();
      this.setState({ agenda: ag || [], semanas: {} });
    } catch (x) {
      const semTabela = /visitas_agenda|PGRST2|relation/i.test(String((x && x.message) || ''));
      this.setState({
        agenda: [],
        erro: semTabela
          ? 'A agenda de visitas ainda não está no banco. Rode o arquivo 42_gerente_agenda_visitas.sql no Supabase.'
          : msgErro(x, 'Não foi possível carregar a agenda dos analistas.')
      });
    }
  }
  async carregarRelatorios() {
    const A = window.FSM_AUTH;
    if (!A.relatoriosEscola) return;
    try {
      const r = await A.relatoriosEscola(cicloDe(hojeIso(), -1));
      this.setState({ relatorios: r || [] });
    } catch (x) {
      this.setState({ relatorios: [] });
    }
  }
  async carregarRelatoriosDoCiclo(comp) {
    const A = window.FSM_AUTH,
      hoje = hojeIso();
    if (!A || !A.relatoriosEscola || !comp || comp >= cicloDe(hoje, -1) || this.state.relatoriosPorCiclo[comp]) return;
    this.setState({ relatoriosPorCiclo: { ...this.state.relatoriosPorCiclo, [comp]: { busy: true } } });
    try {
      const r = await A.relatoriosEscola(comp);
      this.setState({ relatoriosPorCiclo: { ...this.state.relatoriosPorCiclo, [comp]: { lista: r || [] } } });
    } catch (x) {
      this.setState({ relatoriosPorCiclo: { ...this.state.relatoriosPorCiclo, [comp]: { lista: [] } } });
    }
  }
  async carregarCiclo(comp) {
    const A = window.FSM_AUTH,
      hoje = hojeIso();
    if (!comp || comp >= cicloDe(hoje, -1) || this.state.ciclos[comp]) return;
    this.setState({ ciclos: { ...this.state.ciclos, [comp]: { busy: true } } });
    try {
      const oIni = cicloIniIso(comp),

      visita: {
        ...visitaDetalhada,
        perguntar: () => this.setState({ confirmandoCancelamento: true }, () => this.focar('vd-confirma')),
        voltar: () => this.setState({ confirmandoCancelamento: false }),
        cancelar: () => this.cancelarVisita()
      },
      confirmandoCancelamento: !!s.confirmandoCancelamento,
      fecharVisita: () => this.fecharVisita()
    };
  }
  chavesDasContas(s, v) {
    const {
      contaAberta,
      contaDetalhada,
      definirNaConta,
      definirNaMudanca,
      escolaDaMudanca,
      escolasAtivas,
      hoje,
      loteAtual,
      loteDetalhado,
      mudanca,
      nomeDaEscola,
      novaConta,
      perfisDaNovaConta,
      teclaNosPerfis
    } = v;
    return {
      fecharConta: () => this.fecharGavetaDeConta(),
      novaContaAberta: !!s.novaConta,
      novaConta: {
        nome: novaConta.nome || '',
        telefone: novaConta.telefone || '',
        email: novaConta.email || '',
        cpf: novaConta.cpf || '',
        escola: novaConta.escola || '',
        carteira: novaConta.carteira || '',
        jornada: novaConta.jornada || '07:00',
        escolherJornada: definirNaConta('jornada'),
        contratada: novaConta.contratada || '',
        escreverContratada: definirNaConta('contratada'),
        escreverNome: definirNaConta('nome'),
        escreverTelefone: definirNaConta('telefone'),
        escreverEmail: definirNaConta('email'),
        escreverCpf: definirNaConta('cpf'),
        escolherEscola: definirNaConta('escola'),
        escolherCarteira: definirNaConta('carteira')
      },
      perfisDaNovaConta: perfisDaNovaConta,
      dicaDePerfil: 'Contas de coordenador e de gerente veem toda a rede. Crie só para quem precisa.',
      teclaNosPerfis: teclaNosPerfis,
      pedeEscola: novaConta.papel === 'oficineiro' || novaConta.papel === 'direcao',
      ehOficineiro: novaConta.papel === 'oficineiro',
      ehAnalista: novaConta.papel === 'analista',
      opcoesDeEscolaDaConta: escolasAtivas.map(e => ({ valor: e.sigla, rotulo: e.nome })),
      opcoesDeCarteiraDaConta: s.carteiras.map(c => ({ valor: c.id, rotulo: c.rotulo })),
      erroNovaConta: s.erroConta,
      temErroNovaConta: !!(s.novaConta && s.erroConta),
      criarConta: () => this.criarConta(),
      novaContaBotao: s.salvandoConta ? 'Criando…' : 'Criar usuário',
      salvandoConta: s.salvandoConta,
      contaAberta: !!contaAberta,
      conta: contaDetalhada,
      confirmandoDesativacao: s.confirmandoDesativacao,
      erroConta: s.erroConta,
      temErroConta: !!(contaAberta && s.erroConta),
      mudancaAberta: !!s.mudanca,
      mudanca: {
        nome: mudanca.nome || '',
        atual: mudanca.atual ? nomeDaEscola(mudanca.atual) : '—',
        escola: mudanca.escola || '',
        vale: mudanca.vale || '',
        comData: true,
        motivo: mudanca.motivo || '',
        escolherEscola: definirNaMudanca('escola'),
        escolherData: definirNaMudanca('vale'),
        escreverMotivo: definirNaMudanca('motivo')
      },
      opcoesDeEscolaDaMudanca: escolasAtivas
        .filter(e => e.id !== mudanca.atual)
        .map(e => ({ valor: String(e.id), rotulo: e.nome })),
      enderecoDaMudanca: escolaDaMudanca && escolaDaMudanca.endereco ? escolaDaMudanca.endereco : '',
      temEnderecoDaMudanca: !!(escolaDaMudanca && escolaDaMudanca.endereco),
      mudancaMinima: Base.iso(Base.add(dataDe(hoje), 1)),
      mudancaMaxima: Base.iso(Base.add(dataDe(hoje), 180)),
      erroMudanca: s.erroMudanca,
      temErroMudanca: !!s.erroMudanca,
      salvarMudanca: () => this.salvarMudanca(),
      mudancaBotao: s.salvandoConta ? 'Salvando…' : 'Salvar alteração',
      loteAberto: !!loteAtual,
      lote: loteDetalhado,
      erroLote: s.erroLote,
      temErroLote: !!s.erroLote,
      fecharLote: () => this.fecharLote(),
      baixarModelo: () => this.baixarModelo(),
      lerLote: e => this.lerLote(e),
      criarLote: () => this.criarLote(),
      aviso: s.aviso
    };
  }
  chavesDasTelas(s, v) {
    const { contexto } = v;
    return {
      contexto,
      memoriaGeral: this.memoria.geral,
      memoriaAdocao: this.memoria.adocao,
      memoriaAnalistas: this.memoria.analistas,
      memoriaJornada: this.memoria.jornada,
      memoriaOnboarding: this.memoria.onboarding,
      memoriaContas: this.memoria.contas
    };
  }
}
</script>
</body>
