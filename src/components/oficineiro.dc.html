  async voltarSemanaAoPadrao() {

  }
  abrirCopia() {
    if (!this.semanaEditavel(this.memoria.grade.semana))

  semanasFuturas() {
    const s = this.state,
      fimDoAno = s.anoLetivo + '-12-31',
      lista = [];
    for (let outra = segundaDe(new Date()); outra <= fimDoAno && lista.length < 60; outra = somarDias(outra, 7))
      if (outra !== this.memoria.grade.semana && outra.slice(0, 4) === String(s.anoLetivo)) lista.push(outra);
    return lista;
  }
  destinosDaCopia(copia) {
    const semana = this.memoria.grade.semana,
      futuras = this.semanasFuturas();
    const distancia = outra => Math.round((dataDe(outra) - dataDe(semana)) / (7 * 864e5));
    if (copia.modo === 'alt2') return futuras.filter(outra => outra > semana && distancia(outra) % 2 === 0);
    if (copia.modo === 'alt3') return futuras.filter(outra => outra > semana && distancia(outra) % 3 === 0);
    if (copia.modo === 'mes') {
      const ciclo = cicloDaSemana(semana);
      return futuras.filter(outra => cicloDaSemana(outra) === ciclo);
    }
    return futuras.filter(outra => copia.escolhidas && copia.escolhidas[outra]);

  async copiarSemana() {
    const s = this.state,

    if (s.semInternet)

    const mensagem =
      destinos.length === 1
        ? 'Semana copiada para ' + dmIso(destinos[0])
        : 'Semana copiada para ' + destinos.length + ' semanas';
    this.setState({ copia: { ...copia, salvando: true } });

      });
    }

  async enviarGrade() {

  abrirAtividade(daGrade, dia, hora) {
    if (daGrade) {
      const inicio = minDeHora(daGrade.inicio),
        tipo = TIPOS_DA_GRADE.includes(daGrade.tipo) ? daGrade.tipo : 'P';
      const tempos = Math.max(1, Math.min(3, Math.round((minDeHora(daGrade.fim) - inicio) / 50)));
      const outraSolucao = tipo !== 'P' && !!daGrade.solucao && !SOLUCOES.includes(daGrade.solucao);
      const outraOficina = tipo === 'P' && !!daGrade.oficina && !OFICINAS.includes(daGrade.oficina);
      return this.setState({
        gaveta: 'aula',
        edicao: {
          id: daGrade.id,
          dia: String(daGrade.dia_semana),
          horario: String(daGrade.horario || horarioDe(inicio)),
          hora: String(daGrade.inicio).slice(0, 5),
          tempos,
          tipo,
          ano: daGrade.ano == null ? '' : String(daGrade.ano),
          turma: daGrade.turma || '',
          solucao: tipo === 'P' ? '' : outraSolucao ? 'Outra' : daGrade.solucao || 'Matific',
          outraSolucao: outraSolucao ? daGrade.solucao : '',
          componente: tipo === 'R' && COMPONENTES.includes(daGrade.componente) ? daGrade.componente : '',
          oficina: tipo === 'P' ? (outraOficina ? 'Outro' : daGrade.oficina || '') : '',
          outraOficina: outraOficina ? daGrade.oficina : '',
          professor: daGrade.professor || '',
          espaco: daGrade.espaco || 'Laboratório',
          observacao: daGrade.observacao || '',
          erro: '',
          confirmarExcluir: false
        }
      });
    }
    const minutos = horaValida(hora) ? minDeHora(hora) : null;
    this.setState({
      gaveta: 'aula',
      edicao: {
        id: null,
        dia: String(dia || 1),
        horario: minutos == null ? '' : String(horarioDe(minutos)),
        hora: minutos == null ? '' : horaDe(minutos),
        tempos: 1,
        tipo: 'R',
        ano: '',
        turma: '',
        solucao: 'Matific',
        outraSolucao: '',
        componente: '',
        oficina: '',
        outraOficina: '',
        professor: '',
        espaco: 'Laboratório',
        observacao: '',
        erro: '',
        confirmarExcluir: false
      }
    });
  }
  preencherEdicao(mudanca) {
    this.setState(s => ({ edicao: { ...s.edicao, ...mudanca, erro: '', confirmarExcluir: false } }));
  }
  validarAtividade(edicao) {
    if (!['1', '2', '3', '4', '5'].includes(String(edicao.dia))) return 'Escolha o dia da semana.';
    if (!edicao.horario) return 'Escolha o horário.';
    if (!horaValida(edicao.hora)) return 'Informe a hora de início.';
    const inicio = minDeHora(edicao.hora);
    if (inicio < INICIO_DA_GRADE) return 'As atividades começam a partir das 07:00';
    if (inicio + 50 * (edicao.tempos || 1) > FIM_DA_GRADE) return 'A atividade precisa terminar até as 17:00';
    if (edicao.tipo !== 'F' && edicao.ano === '') return 'Escolha o ano.';
    if (edicao.tipo !== 'F' && !edicao.turma) return 'Escolha a turma.';
    if (edicao.tipo === 'R' && !edicao.componente) return 'Escolha o componente curricular.';
    if (edicao.tipo === 'P' && !edicao.oficina) return 'Escolha a oficina.';
    if (edicao.tipo === 'P' && edicao.oficina === 'Outro' && !edicao.outraOficina.trim())
      return 'Informe qual é a oficina.';
    if (edicao.tipo === 'R' && edicao.professor.trim().length < 3) return 'Informe o(a) professor(a) regente.';
    if (edicao.tipo !== 'P' && !edicao.solucao) return 'Escolha a solução prevista.';
    if (edicao.tipo !== 'P' && edicao.solucao === 'Outra' && !edicao.outraSolucao.trim())
      return 'Informe qual é a solução prevista.';
    return '';
  }
  dadosDaAtividade(edicao) {
    const inicio = minDeHora(edicao.hora),
      formacao = edicao.tipo === 'F';
    return {
      ano_letivo: this.state.anoLetivo,
      dia_semana: Number(edicao.dia),
      horario: Number(edicao.horario),
      inicio: horaDe(inicio),
      fim: horaDe(inicio + 50 * (edicao.tempos || 1)),
      ano: formacao ? null : Number(edicao.ano),
      turma: formacao ? null : edicao.turma,
      componente: edicao.tipo === 'R' ? edicao.componente || null : null,
      oficina: edicao.tipo === 'P' ? (edicao.oficina === 'Outro' ? edicao.outraOficina.trim() : edicao.oficina) : null,
      tipo: edicao.tipo,
      solucao: edicao.tipo === 'P' ? null : edicao.solucao === 'Outra' ? edicao.outraSolucao.trim() : edicao.solucao,
      professor: edicao.tipo === 'R' ? edicao.professor.trim() : null,
      espaco: edicao.espaco || null,
      obs: edicao.observacao,
      observacao: edicao.observacao.trim() || null
    };
  }
  async salvarAtividade() {

      edicao = s.edicao,

    delete dados.obs;

      await window.FSM_AUTH.salvarAulaGrade(edicao.id, dados);

        edicao: {
          ...this.state.edicao,
          salvando: false,

  async excluirAtividade() {
    const s = this.state,
      edicao = s.edicao;

  async carregar() {
    const A = window.FSM_AUTH;
    if (!A || !A.logado || !A.logado()) return;
    try {
      const [acesso, daEscola, ciclo] = await Promise.all([
        A.meuAcesso(),
        A.minhaEscola(),
        A.meuCiclo ? A.meuCiclo() : 'dia21'
      ]);
      Base.definirCiclo(ciclo);
      if (!daEscola) return this.avisar('Sua conta ainda não está ligada a uma escola. Procure o coordenador.');
      const escola = {
        id: daEscola.id,
        sigla: daEscola.sigla,
        nome: daEscola.nome,
        latitude: daEscola.latitude,
        longitude: daEscola.longitude,
        raio: daEscola.raio_m
      };
      this.setState({ carregado: true, escola, nomeDoUsuario: (acesso && acesso.nome) || '' }, () => {
        this.carregarPresencaDeHoje();
        this.carregarEspelho();
        this.carregarAjustes();
        this.carregarTurmas();
        this.carregarGrade();
        this.carregarRegistros();
        this.carregarRelatorio();
        this.carregarLembretes();
        this.carregarMudancaDeEscola();
      });
    } catch (x) {
      this.avisar((x && x.message) || 'Não foi possível carregar os dados da escola');
    }
  }
  async carregarPresencaDeHoje() {
    try {
      const presenca = await window.FSM_AUTH.minhaPresencaHoje();
      this.setState({ presencaDeHoje: presenca, desvioDoRelogio: Date.parse(presenca.agora) - Date.now() });
      if (presenca.proxima) this.conferirRaio();
    } catch (x) {
      this.avisar((x && x.message) || 'Não foi possível carregar a presença de hoje');
    }

  async carregarEspelho(competencia) {

    try {
      const espelho = await window.FSM_AUTH.meuEspelho(escolhida);

  async carregarAjustes() {
    try {

  async conferirRaio() {
    const escola = this.state.escola;
    if (!escola || escola.latitude == null || escola.longitude == null || !escola.raio) return;
    try {
      const coordenadas = (await this.localizar()).coords;
      const distancia = Math.round(
        distanciaEmMetros(coordenadas.latitude, coordenadas.longitude, escola.latitude, escola.longitude)
      );
      this.setState({
        posicao: {
          distancia,
          fora: distancia > escola.raio,
          latitude: coordenadas.latitude,
          longitude: coordenadas.longitude,
          precisao: coordenadas.accuracy || 0
        }
      });
    } catch (x) {
      this.setState({ posicao: null });
    }
  }
  localizar() {
    return new Promise((ok, falha) => {
      if (!navigator.geolocation) return falha({ code: 2 });
      navigator.geolocation.getCurrentPosition(ok, falha, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    });
  }
  async marcarPresenca(tipo) {
    if (this.state.marcandoPresenca) return;
    this.setState({ marcandoPresenca: true, erroDaPresenca: null });
    let posicao = null;
    try {
      posicao = await this.localizar();
    } catch (falha) {
      this.setState({
        marcandoPresenca: false,
        erroDaPresenca:
          falha && falha.code === 1
            ? {
                titulo: 'Localização bloqueada',
                texto:
                  'Libere a localização para este site. No Chrome (Android): toque no cadeado ao lado do endereço › Permissões › Localização › Permitir. No Safari (iPhone): Ajustes › Safari › Localização › Permitir.',
                justificar: true
              }
            : {
                titulo: 'Não foi possível obter sua localização',
                texto: 'Tente de novo perto de uma janela ou ao ar livre. Dentro de prédios o GPS costuma piorar.',
                justificar: true
              }
      });
      return;
    }
    try {
      const coordenadas = posicao.coords;
      const resposta = await window.FSM_AUTH.marcarPresenca(
        tipo,
        coordenadas.latitude,
        coordenadas.longitude,
        coordenadas.accuracy
      );
      if (!resposta.aceita) {
        const imprecisa = resposta.motivo === 'Localização imprecisa';
        this.setState({
          erroDaPresenca: {
            titulo: imprecisa ? 'Localização imprecisa' : 'Registro não aceito: ' + resposta.motivo.toLowerCase(),
            texto: imprecisa
              ? 'A precisão do GPS está em ±' +
                resposta.precisao_m +
                ' m. Tente de novo perto de uma janela ou ao ar livre.'
              : resposta.distancia_m != null
                ? 'Você está a ' +
                  resposta.distancia_m +
                  ' m da escola, e o raio aceito é de ' +
                  resposta.raio_m +
                  ' m.'
                : 'A presença não foi gravada.',
            justificar: true
          }
        });
      } else this.avisar(ROTULO_DA_MARCACAO[tipo] + ' registrada às ' + horaDeBrasilia(resposta.em));
      await this.carregarPresencaDeHoje();
    } catch (x) {
      this.setState({
        erroDaPresenca: {
          titulo: 'Registro não enviado',
          texto: (x && x.message) || 'Tente de novo.',
          justificar: false
        }
      });
    } finally {
      this.setState({ marcandoPresenca: false });
    }
  }

  async enviarAjuste() {
    const ajuste = this.memoria.presenca.ajuste,
      recusar = erro => this.lembrar('presenca', { ajuste: { ...ajuste, erro } });
    if (!ajuste.tipo) return recusar('Escolha o tipo de solicitação.');
    if (!ajuste.data) return recusar('Informe a data.');
    if (String(ajuste.motivo || '').trim().length < 5) return recusar('Explique o motivo da solicitação.');
    this.lembrar('presenca', { ajuste: { ...ajuste, enviando: true, erro: '', ok: false } });
    try {
      await window.FSM_AUTH.solicitarAjuste(ajuste);
      this.lembrar('presenca', { ajuste: { ...ajusteVazio(), ok: true } });
      await this.carregarAjustes();

      this.lembrar('presenca', {
        ajuste: {
          ...this.memoria.presenca.ajuste,
          enviando: false,

  lembretesPendentes() {
    const s = this.state,
      hoje = iso(new Date()),
      jaRegistrado = (lista, lembrete) =>
        (lista || []).some(r => r.grade_aula_id === lembrete.grade_aula_id && r.data === lembrete.data);
    return s.lembretes.filter(
      lembrete =>
        lembrete.data <= hoje &&
        s.grade.some(a => a.id === lembrete.grade_aula_id) &&
        !jaRegistrado(s.registrosDoCiclo, lembrete) &&
        !jaRegistrado(s.registrosDoDia, lembrete)
    );
  }
  relatorio() {
    const s = this.state;
    const v = {};
    Object.assign(v, this.ocorrenciasDoRelatorio(s));
    Object.assign(v, this.linhasDoRelatorio(s, v));
    Object.assign(v, this.horasDoRelatorio(s, v));
    Object.assign(v, this.pendenciasDoRelatorio(s, v));
    return Base.escolher(v, CHAVES_DO_RELATORIO);
  }
  ocorrenciasDoRelatorio(s) {
    const competencia = s.competenciaDoRelatorio || this.competenciaAtual(),
      dataDaCompetencia = dataDe(competencia),
      inicioDoCiclo = Base.cicloIni(dataDaCompetencia),
      fimDoCiclo = Base.cicloFim(dataDaCompetencia),
      hoje = Base.iso(new Date());
    const ate = fimDoCiclo < new Date() ? fimDoCiclo : new Date();
    const ocorrencias = [];
    for (let dia = inicioDoCiclo; dia <= ate; dia = Base.add(dia, 1)) {
      const diaDaSemana = dia.getDay(),
        data = Base.iso(dia);
      if (diaDaSemana === 0 || diaDaSemana === 6) continue;
      s.grade
        .filter(
          daGrade =>
            daGrade.dia_semana === diaDaSemana &&
            daGrade.ano_letivo === dia.getFullYear() &&
            (!daGrade.criado_em || data >= Base.iso(new Date(daGrade.criado_em)))
        )
        .forEach(padrao => {
          const daGrade = this.efetiva(padrao, segundaDe(data));
          ocorrencias.push({
            dia,
            data,
            daGrade,
            feriado: Base.feriado(dia),
            registro: s.registrosDoCiclo.find(
              registro => registro.grade_aula_id === daGrade.id && registro.data === data

          });

  resumoDoRegistro(relatorio) {
    const s = this.state;
    const registro = s.registroAberto ? s.registrosDoCiclo.find(x => x.id === s.registroAberto) : null;
    if (!registro) return { temResumo: false, resumo: {} };
    const daGrade = s.grade.find(x => x.id === registro.grade_aula_id),
      dia = dataDe(registro.data),
      realizada = registro.situacao !== 'Não realizada',
      anulada = registro.revisao_status === 'anulado',
      devolvida = registro.revisao_status === 'devolvido';
    const percentual =
      registro.presentes != null && registro.matriculados
        ? ' (' + Math.round((Math.min(registro.presentes, registro.matriculados) / registro.matriculados) * 100) + '%)'
        : '';
    const itens = [
      [
        'Data e horário',
        Base.WDL[dia.getDay()] +
          ', ' +
          Base.dmy(dia) +
          ' · ' +
          String(registro.inicio).slice(0, 5) +
          ' às ' +
          String(registro.fim).slice(0, 5)
      ],
      ['Turma', registro.turma || (daGrade ? turmaTexto(daGrade) : '—')],
      ['Tipo de atividade', tipoDe(registro.tipo).curto],
      ...(registro.tipo === 'R'
        ? [
            ['Componente curricular', registro.componente || (daGrade && daGrade.componente) || 'Não informado'],
            ['Solução', registro.solucao || '—']
          ]
        : registro.tipo === 'P'
          ? [['Oficina', registro.oficina || (daGrade && daGrade.oficina) || 'Não informada']]
          : [['Solução', registro.solucao || '—']]),
      ['Situação', anulada ? 'Anulada pelo coordenador' : registro.situacao]
    ];
    if (realizada)
      itens.push(
        [
          'Presentes',
          registro.presentes != null
            ? registro.presentes +
              (registro.matriculados ? ' de ' + registro.matriculados + ' matriculados' + percentual : '')
            : '—'
        ],
        [
          'Engajamento',
          registro.engajamento ? registro.engajamento + ' de 5 · ' + ENGAJAMENTO[registro.engajamento] : 'Sem nota'
        ],
        ['Objetivo atingido', registro.objetivo || 'Não informado'],
        ['Professor(a) na sala', registro.professor_aula || (daGrade && daGrade.professor) || 'Não informado']
      );
    else itens.push(['Motivo', registro.motivo || '—']);
    const textos = (
      realizada
        ? [
            ['Atividade', registro.atividade],
            ['Como foi a atividade', registro.conteudo],
            ['Mudança de última hora', registro.mudanca],
            ['Próxima atividade', registro.proxima_aula]
          ]
        : []
    )
      .filter(x => x[1])
      .map(([rotulo, valor]) => ({ rotulo, valor }));
    const revisao = anulada
      ? ['Anulada pelo coordenador', 'var(--texto-cinza-600)', 'var(--fundo-cinza-70)']
      : devolvida
        ? ['Devolvida para ajuste', 'var(--texto-vermelho-600)', 'var(--fundo-vermelho-50)']
        : registro.revisao_status === 'revisado'
          ? ['Revisada pelo coordenador', 'var(--texto-verde-760)', 'var(--fundo-verde-80)']
          : registro.revisao_status === 'corrigido'
            ? ['Corrigida · aguardando revisão', 'var(--texto-azul-640)', 'var(--fundo-azul-40)']
            : null;
    return {
      temResumo: true,
      resumo: {
        titulo: (daGrade ? turmaTexto(daGrade) : registro.turma) + ' · ' + Base.dm(dia),
        itens: itens.map(([rotulo, valor]) => ({ rotulo, valor })),
        textos,
        temTextos: textos.length > 0,
        temRevisao: !!revisao,
        revisao: revisao ? revisao[0] + (registro.revisao_obs ? ': ' + registro.revisao_obs : '') : '',
        revisaoCor: revisao ? revisao[1] : '',
        revisaoFundo: revisao ? revisao[2] : '',
        podeCorrigir: devolvida && !!daGrade && relatorio.editavel,
        corrigir: () => {
          this.setState({ registroAberto: null });
          if (daGrade) this.irParaRegistro(registro.data, daGrade.id);
        }
      },
      fecharResumo: () => this.setState({ registroAberto: null })
    };
  }
  edicaoDaSemana() {

          rotulo: TIPOS_DE_ATIVIDADE[chave].nome,

            edicaoDaSemana.tipo !== chave &&
            this.preencherNaSemana({
              tipo: chave,
              solucao:
                chave === 'P'
                  ? ''
                  : solucoesDe(chave).includes(edicaoDaSemana.solucao)
                    ? edicaoDaSemana.solucao
                    : 'Matific',
              componente: '',

      mudarOutraSolucaoNaSemana: evento => this.preencherNaSemana({ outraSolucao: evento.target.value }),
      mudarComponenteNaSemana: evento => this.preencherNaSemana({ componente: evento.target.value }),
      semanaRegular: edicaoDaSemana.tipo === 'R',
      semanaIntegral: edicaoDaSemana.tipo === 'P',
      mudarOficinaNaSemana: evento => this.preencherNaSemana({ oficina: evento.target.value, outraOficina: '' }),
      temOutraOficinaNaSemana: edicaoDaSemana.tipo === 'P' && edicaoDaSemana.oficina === 'Outro',

      salvarNaSemana: () => this.salvarAtividadeDaSemana(false),

      salvarNaSemanaFundo: edicaoDaSemana.salvando ? 'var(--destaque-cinza-300)' : 'var(--destaque-ciano-660)',
      copia,
      copiaComErro: !!copia.erro,

      copiaTexto: alteradas
        ? (alteradas === 1
            ? 'A atividade alterada da semana de ' + dmIso(semana) + ' vai valer também nas semanas escolhidas.'
            : 'As ' +

        : 'A semana de ' +

      modosDaCopia: [

        ['mes', 'Nas outras semanas do ciclo (' + cicloTexto + ')'],

  edicaoDaAtividade() {
    const s = this.state;
    const edicao = s.edicao || {};
    const anosDaEscola = [...new Set((s.turmas || []).map(turma => Number(turma.ano)))]
      .filter(ano => ANOS.includes(ano))
      .sort((x, y) => x - y);
    const anos = anosDaEscola.length ? anosDaEscola : ANOS;
    const turmasDoAno =
      edicao.ano === '' || edicao.ano == null
        ? []
        : (s.turmas || [])
            .filter(turma => String(turma.ano) === String(edicao.ano) && turma.turma)
            .map(turma => turma.turma);
    const turmasDaEdicao =
      edicao.ano === '' || edicao.ano == null ? [] : turmasDoAno.length ? turmasDoAno : TURMAS_PADRAO;
    const inicioDaEdicao = horaValida(edicao.hora) ? minDeHora(edicao.hora) : null;
    const fimDaEdicao = inicioDaEdicao == null ? null : inicioDaEdicao + 50 * (edicao.tempos || 1);
    return {
      edicao,
      mudarDia: evento => this.preencherEdicao({ dia: evento.target.value }),
      diasDaSemana: [1, 2, 3, 4, 5].map(dia => ({ valor: String(dia), rotulo: DIAS[dia] })),
      mudarHorario: evento => {
        const valor = evento.target.value;
        this.preencherEdicao({
          horario: valor,
          ...(valor && !horaValida(this.state.edicao.hora) ? { hora: horarioPadrao(valor) } : {})
        });
      },
      horarios: HORARIOS.map(numero => ({ valor: String(numero), rotulo: numero + 'º horário' })),
      mudarHora: evento => this.preencherEdicao({ hora: evento.target.value }),
      tempos: [1, 2, 3].map(quantidade => {
        const cabe = inicioDaEdicao == null || inicioDaEdicao + 50 * quantidade <= FIM_DA_GRADE,
          marcada = (edicao.tempos || 1) === quantidade;
        return {
          rotulo: quantidade + (quantidade > 1 ? ' horários' : ' horário'),
          marcada: marcada ? 'true' : 'false',
          desligada: !cabe,
          opacidade: cabe ? 1 : 0.4,
          ...this.opcao(marcada),
          escolher: () => cabe && this.preencherEdicao({ tempos: quantidade })
        };
      }),
      termino: fimDaEdicao ? Base.hm(fimDaEdicao) : '—',
      tipos: TIPOS_DA_GRADE.map(chave => {
        const marcada = edicao.tipo === chave;
        return {
          rotulo: TIPOS_DE_ATIVIDADE[chave].nome,
          marcada: marcada ? 'true' : 'false',
          ...this.opcao(marcada, marcada ? TIPOS_DE_ATIVIDADE[chave].cor : null),
          classe: marcada ? '' : 'fundo-branco',
          fundo: marcada ? TIPOS_DE_ATIVIDADE[chave].fundo : 'var(--fundo-branco)',
          escolher: () =>
            edicao.tipo !== chave &&
            this.preencherEdicao({
              tipo: chave,
              solucao: chave === 'P' ? '' : solucoesDe(chave).includes(edicao.solucao) ? edicao.solucao : 'Matific',
              componente: '',
              oficina: '',
              outraOficina: ''
            })
        };
      }),
      mudarAno: evento => this.preencherEdicao({ ano: evento.target.value, turma: '' }),
      mudarComponente: evento => this.preencherEdicao({ componente: evento.target.value }),
      componentes: COMPONENTES.map(item => ({ valor: item, rotulo: item })),
      comTurma: edicao.tipo !== 'F',
      ehIntegral: edicao.tipo === 'P',
      mudarOficina: evento => this.preencherEdicao({ oficina: evento.target.value, outraOficina: '' }),
      oficinas: [...OFICINAS, 'Outro'].map(item => ({ valor: item, rotulo: item })),
      temOutraOficina: edicao.tipo === 'P' && edicao.oficina === 'Outro',
      mudarOutraOficina: evento => this.preencherEdicao({ outraOficina: evento.target.value }),
      anos: anos.map(ano => ({ valor: String(ano), rotulo: anoTexto(ano) })),
      mudarTurma: evento => this.preencherEdicao({ turma: evento.target.value }),
      turmasDoAno: turmasDaEdicao,
      semAno: edicao.ano === '' || edicao.ano == null,
      turmaVazia: edicao.ano === '' || edicao.ano == null ? 'Escolha o ano primeiro' : 'Selecione a turma',
      ehRegular: edicao.tipo === 'R',
      mudarProfessor: evento => this.preencherEdicao({ professor: evento.target.value }),
      escolheSolucao: edicao.tipo !== 'P',
      solucoes: solucoesDe(edicao.tipo).map(valor => {
        const marcada = edicao.solucao === valor;
        return {
          rotulo: valor,
          marcada: marcada ? 'true' : 'false',
          ...this.opcao(marcada),
          escolher: () => this.preencherEdicao({ solucao: valor })
        };
      }),
      temOutraSolucao: edicao.tipo !== 'P' && edicao.solucao === 'Outra',
      mudarOutraSolucao: evento => this.preencherEdicao({ outraSolucao: evento.target.value }),
      mudarEspaco: evento => this.preencherEdicao({ espaco: evento.target.value }),
      mudarObservacaoDaAtividade: evento => this.preencherEdicao({ observacao: evento.target.value }),
      edicaoComErro: !!edicao.erro,
      editando: !!edicao.id,
      salvarTexto: edicao.salvando ? 'Salvando…' : edicao.id ? 'Salvar edição' : 'Adicionar à grade',
      salvarClasse: edicao.salvando ? '' : 'fundo-ciano-660',
      salvarFundo: edicao.salvando ? 'var(--destaque-cinza-300)' : 'var(--destaque-ciano-660)',
      excluirTexto: edicao.confirmarExcluir ? 'Confirmar exclusão' : 'Excluir atividade',
      excluirClasse: edicao.confirmarExcluir ? '' : 'fundo-branco',
      excluirFundo: edicao.confirmarExcluir ? 'var(--destaque-vermelho-600)' : 'var(--fundo-branco)',
      excluirCor: edicao.confirmarExcluir ? 'var(--destaque-branco)' : 'var(--texto-vermelho-600)',
      salvarAtividade: () => this.salvarAtividade(),
      excluirAtividade: () => this.excluirAtividade()
    };
  }

  renderVals() {
    const valores = this.valoresDaTela();
    return { ...valores, gavetasDoPerfil: Base.escolher(valores, CHAVES_DAS_GAVETAS) };
  }
  valoresDaTela() {
    const s = this.state;
    const lembretesPendentes = this.lembretesPendentes();
    const relatorio = this.relatorio();
    const { documento, oficial } = this.documentos(relatorio);
    const selos = {
      registro: s.carregado && lembretesPendentes.length ? String(lembretesPendentes.length) : '',
      horas: relatorio.pendenciasComAcao && relatorio.cicloAtual ? String(relatorio.pendenciasComAcao) : ''
    };
    const navegacao = {};
    const menu = TELAS.map(([chave, rotulo]) => {
      const atual = s.tela === chave,
        tag = selos[chave] || '',
        tagBg = tag ? 'var(--destaque-ambar-310)' : 'transparent',
        abrir = () => this.irPara(chave);
      navegacao[chave] = {
        abrir,
        cor: atual ? 'var(--texto-ciano-660)' : 'var(--texto-cinza-600)',
        selo: tag,
        seloFundo: tagBg
      };
      return {
        label: rotulo,
        tag,
        tagBg,
        go: abrir,
        classe: atual ? 'fundo-branco-a9' : 'fundo-transparent',
        bg: atual ? 'rgba(255,255,255,.09)' : 'transparent',
        fg: atual ? 'var(--destaque-branco)' : 'var(--destaque-cinza-180)',
        dot: atual ? 'var(--destaque-ciano-400)' : 'transparent',
        atual: atual ? 'page' : 'false'
      };
    });
    const atividades = s.abaDoDocumento === 'atividades',
      doDocumento = atividades ? oficial.atividades : oficial.presenca;
    return {
      cliente: Base.cliente(),
      ...this.sino(this.notificacoes(lembretesPendentes)),
      menu,
      navegacao,
      titulo: TELAS.find(([chave]) => chave === s.tela)[1],
      temConfig: typeof window.fsmConfiguracoes === 'function',
      abrirConfig: () => {
        if (this.state.menuAberto) this.setState({ menuAberto: false });
        if (typeof window.fsmConfiguracoes === 'function') window.fsmConfiguracoes();
      },
      temSair: typeof window.fsmSair === 'function',
      sairConta: () => {
        if (typeof window.fsmSair === 'function') window.fsmSair();
      },
      menuClasse: s.menuAberto ? 'open' : '',
      abrirMenu: () => this.setState({ menuAberto: true }),
      fecharMenu: () => this.setState({ menuAberto: false }),
      is: {
        presenca: s.tela === 'presenca',
        grade: s.tela === 'grade',
        registro: s.tela === 'registro',
        horas: s.tela === 'horas'
      },
      semInternet: s.semInternet,
      sincronizadoTexto: 'hoje às ' + s.sincronizadoAs,
      perfilLinha: (s.nomeDoUsuario ? s.nomeDoUsuario + ' · ' : '') + s.escola.sigla,
      escolaNome: s.escola.nome,
      contexto: this.contexto(relatorio, lembretesPendentes),
      memoriaPresenca: this.memoria.presenca,
      memoriaGrade: this.memoria.grade,
      memoriaRegistro: this.memoria.registro,
      memoriaRelatorio: this.memoria.relatorio,
      ...this.resumoDoRegistro(relatorio),
      documentoAberto: s.documentoAberto,
      fecharDocumento: () => this.setState({ documentoAberto: false }),
      cicloNome: Base.Mes(relatorio.dataDaCompetencia),
      documento,
      oficial: doDocumento,
      abaPresenca: !atividades,
      abaAtividades: atividades,
      abaPresencaClasse: atividades ? 'fundo-transparent' : '',
      abaPresencaFundo: atividades ? 'transparent' : 'var(--destaque-branco)',
      abaPresencaCor: atividades ? 'var(--destaque-branco)' : 'var(--destaque-ciano-880)',
      abaAtividadesClasse: atividades ? '' : 'fundo-transparent',
      abaAtividadesFundo: atividades ? 'var(--destaque-branco)' : 'transparent',
      abaAtividadesCor: atividades ? 'var(--destaque-ciano-880)' : 'var(--destaque-branco)',
      verPresenca: () => this.setState({ abaDoDocumento: 'presenca' }),
      verAtividades: () => this.setState({ abaDoDocumento: 'atividades' }),
      declaracao: atividades
        ? 'Declaro que as atividades acima foram realizadas conforme registrado, nas datas e turmas indicadas.'
        : 'Declaro que os horários acima correspondem às minhas atividades presenciais na escola indicada. Todos os registros foram confirmados por geolocalização dentro do raio da escola, ou ajustados por justificativa aprovada pela direção da escola.',
      observacao: (s.observacoes || {})[relatorio.competencia] || '',
      mudarObservacao: evento => {
        const valor = evento.target.value;
        this.setState(st => ({ observacoes: { ...(st.observacoes || {}), [relatorio.competencia]: valor } }));
      },
      imprimir: () => {
        if (documento.bloqueado) return;
        const entreAspas = texto => '"' + String(texto).replace(/[\\"]/g, ' ') + '"';
        const estilo = document.createElement('style');
        estilo.id = 'rel-pagina';
        estilo.textContent =
          '@media print{@page{size:A4;margin:12mm 12mm 16mm;@bottom-left{content:' +
          entreAspas((s.nomeDoUsuario || '—') + ' · ' + doDocumento.codigo) +
          ';font:8pt Inter,system-ui,sans-serif;color:var(--destaque-cinza-670)}@bottom-right{content:"Página " counter(page) " de " counter(pages);font:8pt Inter,system-ui,sans-serif;color:var(--destaque-cinza-670)}}}';
        document.head.appendChild(estilo);
        try {
          window.print();
        } finally {
          setTimeout(() => estilo.remove(), 1000);
        }
      },
      temGaveta: !!s.gaveta,
      gavetaTitulo:
        s.gaveta === 'aula'
          ? s.edicao.id
            ? 'Editar atividade da grade'
            : 'Nova atividade na grade'
          : TITULO_DA_GAVETA[s.gaveta] || 'Registro de atividade',
      gavetaDaAtividade: s.gaveta === 'aula',
      gavetaDaSemana: s.gaveta === 'semana',
      gavetaDaCopia: s.gaveta === 'copiar',
      gavetaDeNotificacoes: s.gaveta === 'notif',
      fecharGaveta: () => this.setState({ gaveta: null }),
      ...this.edicaoDaSemana(),
      ...this.edicaoDaAtividade(),
      aviso: s.aviso
    };
  }
}
</script>
</body>
</html>
