<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficineiro+ · Coordenador do núcleo · Configurações do sistema</title>
<script src="../vendor/dc-runtime/dc-runtime.js"></script>
</head>
<body>
<x-dc>
  <sc-if value="{{ temErro }}" hint-placeholder-val="{{ false }}"><div role="alert" class="fundo-vermelho-50 cor-vermelho-720 raio-10 p-12-14 fs-13">{{ erro }}</div></sc-if>
  <section style="background:var(--fundo-branco)" class="espaco-celular borda-cinza-110 raio-12 p-18-20 d-flex eixo-column gap-14 max-w-640 largura-fundo fundo-branco" aria-labelledby="adm-h-sup">
    <div class="d-flex eixo-column gap-4"><h3 id="adm-h-sup" class="m-0 fs-15">Contato do suporte</h3><span class="fs-13 cor-cinza-600 lh-1p5">Aparece em Configurações, na seção Sobre, para todos os perfis. Deixe em branco o que não quiser mostrar.</span></div>
    <label class="d-flex eixo-column gap-6"><span class="fs-12 cor-cinza-600 fw-600">E-mail do suporte</span><input type="email" value="{{ configuracoes.email }}" onChange="{{ configuracoes.escreverEmail }}" maxlength="120" placeholder="Endereço que receberá os pedidos de ajuda" class="h-40 borda-cinza-160 raio-8 p-0-12 fs-14 fonte-inherit"></input></label>
    <label class="d-flex eixo-column gap-6"><span class="fs-12 cor-cinza-600 fw-600">Telefone do suporte</span><input value="{{ configuracoes.telefone }}" onChange="{{ configuracoes.escreverTelefone }}" inputmode="tel" maxlength="20" placeholder="(31) 3333-4444" class="h-40 borda-cinza-160 raio-8 p-0-12 fs-14 fonte-inherit"></input></label>
    <label class="d-flex eixo-column gap-6"><span class="fs-12 cor-cinza-600 fw-600">Horário de atendimento</span><input value="{{ configuracoes.horario }}" onChange="{{ configuracoes.escreverHorario }}" maxlength="120" placeholder="Segunda a sexta, das 8h às 17h" class="h-40 borda-cinza-160 raio-8 p-0-12 fs-14 fonte-inherit"></input></label>
    <div class="d-flex justifica-flex-end"><button style="background:var(--destaque-ciano-660)" onClick="{{ configuracoes.salvar }}" disabled="{{ salvando }}" class="h-40 borda-0 cor-branco raio-8 p-0-16 fs-14 fw-600 fonte-inherit fundo-ciano-660">{{ configuracoes.botao }}</button></div>
  </section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const contexto = this.props.contexto;
    const configuracoes = contexto.configuracoes || {};
    const definirNaConfiguracao = k => e =>
      contexto.setState({
        configuracoes: { ...contexto.estado().configuracoes, [k]: e.target.value },
        erroSistema: ''
      });
    return {
      temErro: !!contexto.erroSistema,
      erro: contexto.erroSistema,
      configuracoes: {
        ...configuracoes,
        escreverEmail: definirNaConfiguracao('email'),
        escreverTelefone: definirNaConfiguracao('telefone'),
        escreverHorario: definirNaConfiguracao('horario'),
        salvar: () => contexto.salvarConfiguracoes(),
        botao: contexto.salvandoSistema ? 'Salvando…' : 'Salvar'
      }
    };
  }
}
</script>
</body>
</html>
