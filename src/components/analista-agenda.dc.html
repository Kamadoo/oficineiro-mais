<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficineiro+ · Analista · Agenda</title>
<script src="../vendor/dc-runtime/dc-runtime.js"></script>
</head>
<body>
<x-dc>
  <div class="d-flex quebra-wrap gap-10-12 alinha-center">
    <div role="group" aria-label="Semana" class="d-flex alinha-center gap-6">
      <button onClick="{{ semanaAnterior }}" aria-label="Semana anterior" class="w-36 h-36 borda-cinza-160 fundo-branco raio-8 cor-ciano-850 fs-16 p-0 largura-fundo botao-secundario">‹</button>
      <span class="fs-13 fw-600 min-w-170 texto-center">{{ semanaTexto }}</span>
      <button onClick="{{ semanaSeguinte }}" aria-label="Próxima semana" class="w-36 h-36 borda-cinza-160 fundo-branco raio-8 cor-ciano-850 fs-16 p-0 largura-fundo botao-secundario">›</button>
      <sc-if value="{{ foraDaSemanaAtual }}" hint-placeholder-val="{{ false }}"><button onClick="{{ semanaAtual }}" class="h-36 borda-cinza-160 fundo-branco raio-8 p-0-12 fs-13 fw-600 cor-ciano-850 botao-secundario">Esta semana</button></sc-if>
    </div>
    <div class="oculto-celular flex-1"></div>
    <button style="background:var(--destaque-ciano-660)" class="largura-total-celular h-38 borda-0 cor-branco raio-8 p-0-14 fs-14 fw-600 fundo-ciano-660" onClick="{{ agendarVisita }}" aria-haspopup="dialog">+ Nova visita</button>
  </div>
  <div class="empilha-celular d-grid colunas-repeat-5-minmax-0-1fr gap-12" style="opacity:{{ opacidade }}">
    <sc-for list="{{ semana }}" as="dia" hint-placeholder-count="5">
      <section class="dia-celular raio-12 p-14 d-flex eixo-column gap-10 min-h-220 min-w-0 largura-fundo {{ dia.classe }}" style="background:{{ dia.fundo }};border:1px solid {{ dia.borda }}" aria-label="{{ dia.aria }}">
        <div class="d-flex justifica-space-between alinha-baseline"><b>{{ dia.nome }}</b><span class="num-tabular-nums fs-12 cor-cinza-600">{{ dia.data }}</span></div>
        <sc-if value="{{ dia.vazio }}" hint-placeholder-val="{{ false }}"><span class="fs-12 cor-cinza-600">{{ dia.vazioTexto }}</span></sc-if>
        <sc-for list="{{ dia.visitas }}" as="visita" hint-placeholder-count="2">
          <button onClick="{{ visita.abrir }}" aria-haspopup="dialog"
            class="raio-8 p-10 d-flex eixo-column gap-2 texto-left cor-ciano-850 w-100pc min-w-0 largura-fundo"
            style="border:0;border-left:3px solid {{ visita.cor }};background:{{ visita.fundo }};cursor:pointer"><span
            class="num-tabular-nums fs-12 cor-cinza-600">{{ visita.hora }}</span><span
            class="fs-13 fw-600 quebra-palavra-anywhere">{{ visita.escola }}</span><span
            class="fs-12 cor-cinza-750 quebra-palavra-anywhere">{{ visita.tipo }}</span><span class="fs-11 fw-600"
            style="color:{{ visita.situacaoCor }}">{{ visita.situacao }}</span></button>
        </sc-for>
      </section>
    </sc-for>
  </div>
  <div class="d-flex quebra-wrap gap-8-16 fs-12 cor-cinza-750"><b class="fw-600 cor-cinza-600">Origem da visita:</b><sc-for list="{{ origens }}" as="origem" hint-placeholder-count="5"><span class="d-flex alinha-center gap-6"><span class="w-10 h-10 raio-2 largura-fundo" style="background:{{ origem.cor }}"></span>{{ origem.rotulo }}</span></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const Base = window.FSM_BASE;
const { WDL: DIAS, dataDe, hmDe, dmIso, segDe } = Base;
const ORIGEM = Base.ORIGEM_VISITA;
class Component extends DCLogic {
  lembrar(mudanca) {
    Object.assign(this.props.memoria, mudanca);
    this.forceUpdate();
  }
  renderVals() {
    const contexto = this.props.contexto,
      memoria = this.props.memoria;
    const { hoje, agendaValida, nomeDaEscola, origemDe } = contexto;
    const segunda = Base.iso(Base.add(dataDe(segDe(hoje)), memoria.semana * 7));
    const diasDaSemana = [0, 1, 2, 3, 4].map(k => Base.iso(Base.add(dataDe(segunda), k)));
    const vinculadas = new Set(contexto.agenda.map(v => v.visita_id).filter(Boolean));
    const semana = diasDaSemana.map(dia => {
      const feriado = Base.feriado(dataDe(dia)),
        ehHoje = dia === hoje;
      const visitas = agendaValida
        .filter(v => v.data === dia)
        .sort((a, b) => String(a.hora || '').localeCompare(String(b.hora || '')))
        .map(v => {
          const origem = origemDe(v.origem),
            semRegistro = v.status === 'agendada' && v.data < hoje,
            realizada = v.status === 'realizada';
          return {
            hora: v.hora ? hmDe(v.hora) : 'sem horário',
            escola: nomeDaEscola(v.escola_id),
            tipo: (v.tipo || 'Visita') + ' · ' + origem[0],
            situacao: realizada
              ? 'Realizada'
              : semRegistro
                ? 'Sem registro'
                : v.data_original
                  ? 'Remarcada de ' + dmIso(v.data_original)
                  : 'Agendada',
            situacaoCor: realizada
              ? 'var(--texto-verde-700)'
              : semRegistro
                ? 'var(--texto-vermelho-600)'
                : 'var(--texto-cinza-600)',
            cor: origem[1],
            fundo: realizada ? 'var(--fundo-verde-80)' : 'var(--fundo-cinza-20)',
            aria: 'Ver visita em ' + nomeDaEscola(v.escola_id) + ', ' + dmIso(dia),
            abrir: () => contexto.abrirVisitaDaAgenda(v.id)
          };
        })
        .concat(
          contexto.minhasVisitas
            .filter(v => v.data === dia && !v.agenda_id && !vinculadas.has(v.id))
            .map(v => ({
              hora: 'registrada',
              escola: nomeDaEscola(v.escola_id),
              tipo: v.tipo + (v.subtipo ? ' · ' + v.subtipo : ''),
              situacao: 'Fora da agenda',
              situacaoCor: 'var(--texto-verde-700)',
              cor: 'var(--texto-verde-700)',
              fundo: 'var(--fundo-verde-80)',
              aria: 'Ver visita registrada em ' + nomeDaEscola(v.escola_id) + ', ' + dmIso(dia),
              abrir: () => contexto.abrirVisita(v.id)
            }))
        );
      return {
        nome: DIAS[dataDe(dia).getDay()],
        data: dmIso(dia),
        aria: DIAS[dataDe(dia).getDay()] + ', ' + dmIso(dia),
        visitas,
        vazio: visitas.length === 0,
        vazioTexto: feriado ? 'Feriado · ' + feriado : 'Sem visitas agendadas',
        classe: ehHoje ? '' : 'fundo-branco borda-cinza-110',
        fundo: ehHoje ? 'var(--fundo-ciano-40)' : 'var(--fundo-branco)',
        borda: ehHoje ? 'var(--borda-ciano-120)' : 'var(--borda-cinza-110)'
      };
    });
    return {
      opacidade: contexto.opacidade,
      semanaTexto: 'Semana de ' + dmIso(segunda) + ' a ' + dmIso(diasDaSemana[4]),
      semanaAnterior: () => this.lembrar({ semana: memoria.semana - 1 }),
      semanaSeguinte: () => this.lembrar({ semana: memoria.semana + 1 }),
      semanaAtual: () => this.lembrar({ semana: 0 }),
      foraDaSemanaAtual: memoria.semana !== 0,
      agendarVisita: () => contexto.agendarVisita(),
      semana,
      origens: Base.ORIGENS_VISITA.map(chave => ({ rotulo: ORIGEM[chave][0], cor: ORIGEM[chave][1] }))
    };
  }
}
</script>
</body>
</html>
