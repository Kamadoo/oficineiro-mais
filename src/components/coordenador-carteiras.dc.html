<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficineiro+ · Coordenador do núcleo · Carteiras</title>
<script src="../vendor/dc-runtime/dc-runtime.js"></script>
</head>
<body>
<x-dc>
  <div class="d-flex gap-10-12 alinha-center quebra-wrap">
    <p class="m-0 fs-13 cor-cinza-600 flex-1 min-w-220 lh-1p5">Cada analista acompanha as escolas de uma carteira.</p>
    <button class="largura-total-celular h-40 borda-0 cor-branco raio-8 p-0-16 fs-14 fw-600 fonte-inherit fundo-ciano-660" style="background:#0B7EA3" onClick="{{ novaCarteira }}" aria-haspopup="dialog">+ Nova carteira</button>
  </div>
  <section class="adm-tabela borda-cinza-110 raio-12 rolagem-auto fundo-branco" style="background:var(--fundo-branco);opacity:{{ opacidade }}" aria-labelledby="adm-h-carteiras">
    <h3 id="adm-h-carteiras" class="sr-only">Carteiras</h3>
    <div role="table" aria-labelledby="adm-h-carteiras" class="min-w-560">
      <div role="row" class="d-grid colunas-90-minmax-0-2fr-120-120 gap-10 p-12-20 fs-12 fw-600 cor-cinza-600 borda-b-cinza-110"><span role="columnheader">Código</span><span role="columnheader">Carteira</span><span role="columnheader">Escolas ativas</span><span role="columnheader">Analistas</span></div>
      <sc-for list="{{ carteiras }}" as="carteira" hint-placeholder-count="4">
        <div role="row" class="d-grid colunas-90-minmax-0-2fr-120-120 gap-10 p-12-20 fs-13 borda-b-cinza-70 alinha-center">
          <span role="cell" class="num-tabular-nums fs-12" style="font-family:'Inter',system-ui,sans-serif">{{ carteira.codigo }}</span>
          <span role="cell" class="min-w-0"><button onClick="{{ carteira.abrir }}" aria-haspopup="dialog" aria-label="{{ carteira.aria }}" class="borda-0 fundo-transparent p-0 min-h-0 fs-14 fw-600 cor-ciano-850 texto-left fonte-inherit sublinha-3 botao-texto" style="cursor:pointer;text-decoration:underline;text-decoration-color:#CFDADD">{{ carteira.rotulo }}</button></span>
          <span role="cell">{{ carteira.escolas }}</span>
          <span role="cell">{{ carteira.analistas }}</span>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{ semCarteiras }}" hint-placeholder-val="{{ false }}"><p class="m-0 p-18-20 fs-13 cor-cinza-600">Nenhuma carteira cadastrada.</p></sc-if>
  </section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const contexto = this.props.contexto;
    const { carts, escs, ativas } = contexto;

    return {
      opacidade: contexto.carregandoSistema ? 0.6 : 1,
      carteiras: carts.map(c => ({
        codigo: c.id,
        rotulo: c.rotulo,
        escolas: String(escs.filter(e => e.carteira_id === c.id && e.ativa !== false).length),
        analistas: String(ativas.filter(a => a.papel === 'analista' && a.carteira_id === c.id).length),
        aria: 'Editar a carteira ' + c.rotulo,
        abrir: () =>
          contexto.abrirGavetaDeAdmin(
            { carteiraEditada: { id: c.id, rotulo: c.rotulo, nova: false } },
            'adm-cart-rotulo'
          )
      })),
      semCarteiras: !carts.length && !contexto.carregandoSistema,
      novaCarteira: () =>
        contexto.abrirGavetaDeAdmin({ carteiraEditada: { id: '', rotulo: '', nova: true } }, 'adm-cart-id')
    };
  }
}
</script>
</body>
</html>
