name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: pip install ruff
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: cp src/config.example.js src/config.js
      - run: python scripts/build.py

  edge-functions:
    name: Funções de borda
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.6
      - run: deno fmt --check
      - run: deno lint
      - run: deno check acesso/index.ts admin-usuarios/index.ts

  database:
    name: Banco de dados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 3.1.0
      - run: supabase db start
      - run: supabase db reset --no-seed
      - run: supabase test db
      - name: Auditoria de RLS
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -d postgres -v ON_ERROR_STOP=1 -q -f tests/fixtures/dados_teste.sql
          python3 tests/security/rls_audit.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp src/config.example.js src/config.js
      - run: python3 scripts/build.py
      - name: Varredura das telas e acessibilidade
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: npm run test:ui
