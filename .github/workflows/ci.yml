name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: pip install ruff
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: cp src/config.example.js src/config.js
      - run: python scripts/build.py

  edge-functions:
    name: Funções de borda
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check acesso/index.ts admin-usuarios/index.ts

  database:
    name: Banco de dados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase db reset --no-seed
      - run: supabase test db
      - name: Auditoria de RLS
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -d postgres -v ON_ERROR_STOP=1 -q -f tests/fixtures/dados_teste.sql
          python3 tests/security/rls_audit.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp src/config.example.js src/config.js
      - run: python3 scripts/build.py
      - name: Varredura das telas e acessibilidade
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: npm run test:ui
