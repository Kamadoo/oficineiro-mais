name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: pip install ruff
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: cp src/config.example.js src/config.js
      - run: python scripts/build.py

  edge-functions:
    name: Funções de borda
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.6
      - run: deno fmt --check
      - run: deno lint
      - run: deno check acesso/index.ts admin-usuarios/index.ts convites/index.ts
      - run: deno test --allow-env --allow-read tests/

  banco:
    name: Testes do banco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 3.1.0
      - run: supabase db start
      - run: supabase db reset --no-seed
      - run: supabase test db
      - run: supabase db reset --no-seed
      - name: Auditoria de RLS
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -d postgres -v ON_ERROR_STOP=1 -q -f tests/fixtures/dados_teste.sql
          python3 tests/security/rls_audit.py
          python3 tests/security/rpc_matrix.py
          python3 tests/security/scope_audit.py

  mudancas:
    name: Telas afetadas
    runs-on: ubuntu-latest
    outputs:
      varrer: ${{ steps.decidir.outputs.varrer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: decidir
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "varrer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" "$GITHUB_SHA" > alterados.txt
          cat alterados.txt
          if grep -qvE '^(docs/|supabase/functions/|supabase/tests/|tests/security/|\.github/dependabot\.yml$|LICENSE$|[^/]*\.md$)' alterados.txt; then
            echo "varrer=true" >> "$GITHUB_OUTPUT"
          else
            echo "varrer=false" >> "$GITHUB_OUTPUT"
          fi

  varredura:
    name: Varredura (${{ matrix.grupo }})
    needs: mudancas
    if: needs.mudancas.outputs.varrer == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grupo: [gerente, "coordenador,administrador", "analista,direcao,oficineiro,oficineiro_tempo_integral"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 3.1.0
      - run: supabase db start
      - run: supabase db reset --no-seed
      - name: Dados de teste
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -d postgres -v ON_ERROR_STOP=1 -q -f tests/fixtures/dados_teste.sql
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp src/config.example.js src/config.js
      - run: python3 scripts/build.py
      - name: Varredura das telas e acessibilidade
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          SO: ${{ matrix.grupo }}
          TEMAS: ${{ github.event_name == 'pull_request' && 'claro' || 'claro,escuro' }}
          CELULAR: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: npm run test:ui

  database:
    name: Banco de dados
    needs: [banco, mudancas, varredura]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        run: |
          echo "testes do banco: ${{ needs.banco.result }}"
          echo "telas afetadas: ${{ needs.mudancas.result }} (varrer: ${{ needs.mudancas.outputs.varrer }})"
          echo "varredura: ${{ needs.varredura.result }}"
          test "${{ needs.banco.result }}" = "success"
          test "${{ needs.mudancas.result }}" = "success"
          if [ "${{ needs.mudancas.outputs.varrer }}" = "true" ]; then
            test "${{ needs.varredura.result }}" = "success"
          fi
